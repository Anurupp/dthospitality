<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Hospitality Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#292929;--mut:#6b6b6b;--gold:#c5a46d;--green:#243b32;--blush:#ead5d0;--sage:#a8b5a0;--line:#e7e0d3;--bad:#a4442f;--yellow:#f2c94c}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0}header{background:var(--green);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}header h1{font-size:22px;color:#fff}header span{color:var(--gold);font-size:13px}header .spacer{flex:1}nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}nav button{border:0;background:none;color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;font:500 14px Inter;white-space:nowrap}nav button.on{background:var(--green);color:#fff}main{max-width:1250px;margin:0 auto;padding:18px 14px 60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 6px #0000000d}.stat b{display:block;font:700 28px "Playfair Display",serif;color:var(--green)}.stat small{color:var(--mut)}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}input,select,textarea,button.b{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}button{cursor:pointer}button.b{background:var(--green);color:#fff;border:0;font-weight:600}button.b.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.b.s{padding:5px 9px;font-size:12px}button:disabled{opacity:.55;cursor:wait}.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{position:sticky;top:0;background:var(--card);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--blush);color:var(--ink);margin:1px}.tag.ok{background:#d9efdf;color:#17663a}.tag.warn{background:#f3d9a8;color:#4a3410}.tag.bad{background:#a4442f;color:#fff}.tag.expected{background:#fff2cc;color:#805b00}.tag.in{background:#ddf3e4;color:#17663a}.tag.out{background:#fce3e3;color:#a12626}dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(760px,94vw);max-height:92vh;padding:20px;overflow:auto}dialog::backdrop{background:#0008}dialog[open]{animation:pop .22s ease}@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px;min-width:0}.f label.w{grid-column:1/-1}.f input,.f select,.f textarea{width:100%;min-width:0}.f select.nat{display:none}.sec{border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px;margin:12px 0;background:#fffaf0}.sec h3{font-size:17px;margin-bottom:10px}
/* Add-guest form sections */
.fs{border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:14px 14px 16px;margin:14px 0;background:#fffaf0;animation:rise .4s ease both}.fs:nth-of-type(2){animation-delay:.06s}.fs:nth-of-type(3){animation-delay:.12s}.fs:nth-of-type(4){animation-delay:.18s}.fs h3{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--green);margin:0 0 2px}.fs h3 b{width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--yellow);font:700 13px Inter,sans-serif;display:grid;place-items:center;flex:none}.fs .hint{margin:0 0 12px 36px;font-size:12px;color:var(--mut)}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fb{position:sticky;bottom:-20px;background:var(--card);margin:6px -20px -20px;padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;z-index:35}
/* Animated dropdowns */
.dd{position:relative}.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s}.ddb:hover{border-color:var(--gold)}.dd.open .ddb{border-color:var(--gold);box-shadow:0 0 0 3px #c5a46d33}.ddb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ddb i{flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translateY(-2px);transition:transform .25s}.dd.open .ddb i{transform:rotate(-135deg) translateY(-2px)}.dd.open{z-index:40}.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--gold);border-radius:12px;box-shadow:0 14px 30px #0003;max-height:230px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top;transition:opacity .18s,transform .18s,visibility .18s}.dd.open .ddl{opacity:1;visibility:visible;transform:none}.dd.up .ddl{top:auto;bottom:calc(100% + 6px);transform-origin:bottom;transform:translateY(8px) scale(.98)}.dd.up.open .ddl{transform:none}.ddl li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);transition:background .12s,padding-left .15s}.ddl li:hover,.ddl li:focus{background:var(--blush);padding-left:15px;outline:none}.ddl li.ph{color:var(--mut)}.ddl li.sel{background:var(--green);color:#fff;font-weight:600}
/* Red error boxes */
.err{position:sticky;top:-20px;z-index:60;margin:-20px -20px 14px;padding:13px 16px;background:#b3261e;color:#fff;display:flex;gap:12px;align-items:flex-start;border-bottom:3px solid #6e1510;box-shadow:0 8px 22px #b3261e66;animation:errIn .35s cubic-bezier(.2,.9,.3,1.15) both,shake .5s .35s}.err.fx{position:fixed;top:12px;left:0;right:0;margin:0 auto;width:min(580px,92vw);border-radius:14px;z-index:100000;border:2px solid #6e1510}.err .ei{font-size:22px;line-height:1.2;flex:none}.err .em{flex:1;font-size:14px;white-space:pre-line;min-width:0}.err .em b{display:block;font-size:15px;margin-bottom:2px}.err .ea,.err .ex{border:1px solid #ffffff88;background:#ffffff22;color:#fff;border-radius:8px;padding:5px 10px;font-weight:600;font-size:12px;flex:none}.err .ea:hover,.err .ex:hover{background:#ffffff44}.errf{border-color:#b3261e!important;box-shadow:0 0 0 3px #b3261e44!important;animation:shake .45s}@keyframes errIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 0;border-bottom:1px dashed var(--line)}.empty{text-align:center;color:var(--mut);padding:28px}.room{display:inline-block;font:700 19px "Playfair Display",serif;background:var(--blush);color:var(--ink);border:1px solid var(--gold);padding:1px 10px;border-radius:8px}.hh{background:#243b32;color:#f2c94c;font-weight:700;padding:8px 12px;border-radius:10px;border-bottom:3px solid #f2c94c}.dn{font:800 18px Inter,sans-serif;color:var(--green)}#admin-login{display:flex;position:fixed;inset:0;z-index:99999;background:#151c18;color:#fff;align-items:center;justify-content:center;padding:20px}#admin-login form{width:100%;max-width:390px;padding:28px;border:1px solid #536456;border-radius:16px;background:#1f2922}#admin-login label{display:block;font-size:13px}#admin-login input{display:block;width:100%;padding:12px;margin:7px 0 16px;color:#222;background:#fff}#admin-login button{width:100%;padding:12px;background:#c5a46d;color:#17251d;border:0;border-radius:10px;font-weight:700}#admin-login-error{color:#ffaaaa;white-space:pre-wrap}#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#243b32;color:#f2c94c;padding:10px 20px;border-radius:999px;font-weight:600;z-index:999;box-shadow:0 6px 20px #0005;max-width:90vw;text-align:center}#ts.bad{background:#b3261e;color:#fff;z-index:100000}
/* PDF preview / print */
#pv,#pv *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pv{display:none}#pv.open{display:block;position:fixed;inset:0;background:#e9e6df;color:#111;overflow:auto;z-index:50;padding:16px}#pv .tb{margin-bottom:12px;display:flex;gap:8px}#pv .pg{position:relative;isolation:isolate;margin:0 auto;background:#fff;padding:10mm;box-shadow:0 2px 14px #0004;overflow:visible;color:#111}#pv .pg.land{width:297mm}#pv .pg.port{width:210mm}#pv .pg h1{font-size:22px;color:#243b32;border-bottom:3px solid #c5a46d;padding-bottom:6px;margin:0 0 8px}#pv .pg h2{font-size:16px;margin:12px 0 6px;color:#111}#pv .pg table{min-width:0;width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px}#pv .pg table.wide{min-width:0}#pv .pg th,#pv .pg td{border:1px solid #cfc6b4;padding:5px 6px;overflow-wrap:anywhere;color:#111}#pv .pg th{position:static;background:#243b32;color:#fff;font-size:10px}#pv .pg table:not(.pr) tbody tr:nth-child(even) td{background:#faf5ea}#pv .pg h2.sh{background:linear-gradient(90deg,#243b32,#3c5e4c);color:#f2c94c;padding:5px 12px;border-radius:8px;border-bottom:3px solid #c5a46d;font-size:15px;margin:12px 0 6px}
#pv .hd{background:linear-gradient(135deg,#1c2e26,#2f5142 55%,#243b32);color:#faf7f2;text-align:center;padding:14px 10px 12px;border:2px solid #c5a46d;border-radius:10px;margin-bottom:12px}#pv .hd .orn{color:#e7c987;letter-spacing:.4em;font-size:14px}#pv .hd .nm{font:700 30px "Playfair Display",Georgia,serif;color:#f0dcae;margin:2px 0}#pv .hd .sb{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#fff}
#pv .dv{border:2px solid #c5a46d;background:#fff8e8;border-radius:10px;padding:10px 14px;margin:10px 0}#pv .dv h2{margin:0 0 6px;color:#243b32}
/* Admin arrival cell: time, pickup point and train on separate lines */
#pv .a1{font-size:12px;margin-bottom:3px}#pv .a2{font-size:10.5px;color:#333;margin-top:2px}
/* Driver sheet arrival box: Date, Time, Pickup and Train each on their own line */
#pv .ab div{display:flex;gap:8px;align-items:baseline;padding:2px 0}#pv .ab div+div{border-top:1px dotted #cfc6b4}#pv .ab span{flex:none;width:44px;color:#666;font-size:9px;text-transform:uppercase;letter-spacing:.06em}#pv .ab b{font-size:12.5px;color:#111}#pv .ab .t{font-size:15px;color:#243b32}#pv .ab em{font-style:normal;font-size:11.5px;color:#111}
/* Guest sheet: simple boxes with label / value rows */
#pv .dear{font-size:15px;margin:0 0 2px}#pv .dear2{margin:0;font-size:12.5px;color:#444}#pv .gg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}#pv .gb{border:1px solid #cfc6b4;border-top:3px solid #c5a46d;border-radius:6px;padding:10px 14px;margin:0 0 12px;background:transparent}#pv .gg .gb{margin:0}#pv .gb h3{margin:0 0 4px;font-size:15px;color:#243b32}#pv .kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid #eee4d0}#pv .kv:last-child{border-bottom:0}#pv .kv span{color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.07em;flex:none}#pv .kv b{text-align:right;font-size:13px;color:#111}#pv .nt{margin:4px 0 0;font-size:12.5px;color:#333}
#pv .ms{border-left:4px solid #c5a46d;background:#faf7f2;padding:10px 14px;margin-top:12px;font-size:13px;color:#111;border-radius:0 8px 8px 0}#pv .ft{color:#555;font-size:10px}#pv .conf{text-align:center;font-size:16px;letter-spacing:.4em;margin:8px 0 2px;color:#c5a46d}#pv a{color:#164e9c;overflow-wrap:anywhere}
#pv .dv,#pv .ms,#pv .pr,#pv .gb,#pv tr{break-inside:avoid;page-break-inside:avoid}
@media print{html,body{background:#fff}body>*:not(#pv){display:none!important}#pv.open{position:static;overflow:visible;padding:0}#pv .tb{display:none}#pv .pg{overflow:visible;width:auto!important;padding:8mm;box-shadow:none;zoom:1!important}#pv .pg table.wide{min-width:0}}@media(max-width:560px){.f{grid-template-columns:1fr}.f label.w{grid-column:auto}header h1{font-size:19px}main{padding:12px 9px 50px}nav{padding:6px}nav button{padding:8px 10px}.fs .hint{margin-left:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* ================= Motion ================= */
/* Header: flowing gradient + travelling gold shine, title drops in */
header{position:relative;overflow:hidden;background:linear-gradient(110deg,#243b32,#365746,#243b32,#2b4a3b);background-size:300% 100%;animation:flow 14s ease-in-out infinite}
header::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#f2c94c,transparent) no-repeat;background-size:35% 100%;animation:shine 3.6s linear infinite}
header h1{animation:hin .9s cubic-bezier(.2,.9,.3,1.25) both}header span{animation:hin .9s .18s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes flow{50%{background-position:100% 0}}@keyframes shine{from{background-position:-60% 0}to{background-position:160% 0}}@keyframes hin{from{opacity:0;transform:translateY(-18px) scale(.9)}to{opacity:1;transform:none}}
/* Soft drifting colour glows behind everything */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 20%,#c5a46d26,transparent 38%),radial-gradient(circle at 85% 75%,#a8b5a038,transparent 42%),radial-gradient(circle at 60% 10%,#ead5d044,transparent 35%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-4%,3%) scale(1.12)}}
/* Navigation pill that slides between sections */
nav{position:sticky}#ni{position:absolute;left:0;top:8px;bottom:8px;width:0;border-radius:999px;background:var(--green);box-shadow:0 6px 16px #243b3255;z-index:0;transition:transform .55s cubic-bezier(.34,1.5,.64,1),width .55s cubic-bezier(.34,1.5,.64,1)}
nav button{position:relative;z-index:1;transition:color .3s,transform .25s cubic-bezier(.34,1.56,.64,1)}nav button.on{background:transparent;color:#fff}nav button:hover:not(.on){transform:translateY(-2px);color:var(--green)}nav button:active{transform:scale(.92)}
/* Section entrance */
.rv{animation:rv .65s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rv{from{opacity:0;transform:translate(var(--dx,0),26px) scale(.93) rotate(-1.2deg);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
#sw{position:fixed;top:0;left:0;width:100%;height:3px;z-index:100001;background:linear-gradient(90deg,#c5a46d,#f2c94c,#c5a46d);box-shadow:0 0 12px #f2c94c;transform-origin:left;animation:sweep .85s ease-out forwards}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}65%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
/* Buttons, cards, rows */
button.b{position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,background .2s}button.b:hover{transform:translateY(-2px);box-shadow:0 10px 20px #243b3238}button.b:active{transform:scale(.94);box-shadow:none}
.rip{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rip .65s ease-out;pointer-events:none}button.b.g .rip{background:#c5a46d55}@keyframes rip{to{transform:scale(1);opacity:0}}
.card{transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s}.card:hover{transform:translateY(-5px) scale(1.012);box-shadow:0 16px 32px #243b3226;border-color:var(--gold)}.card.stat:active{transform:scale(.96)}
.tw tbody tr{transition:background .25s}.tw tbody tr:hover{background:#fffaf0}.card .row{transition:padding-left .25s,background .25s}.card .row:hover{padding-left:8px;background:#fffaf033}
.tag.bad{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #a4442f77}50%{box-shadow:0 0 0 7px #a4442f00}}
.room{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.room:hover{transform:rotate(-4deg) scale(1.12)}
/* Forms, dialogs, dropdowns, toasts */
input,select,textarea{transition:border-color .2s,box-shadow .25s}.f input:focus,.f textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px #c5a46d33;outline:none}
dialog[open]{animation:pop2 .45s cubic-bezier(.2,1.3,.3,1)}@keyframes pop2{from{opacity:0;transform:translateY(46px) scale(.9) rotate(-1deg)}to{opacity:1;transform:none}}
dialog::backdrop{backdrop-filter:blur(4px);animation:fadeIn .3s}@keyframes fadeIn{from{opacity:0}}
.dd.open .ddl li{animation:liIn .34s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i,0)*30ms)}@keyframes liIn{from{opacity:0;transform:translateX(-16px)}}
#ts{animation:toastIn .5s cubic-bezier(.2,1.4,.4,1)}@keyframes toastIn{from{opacity:0;transform:translate(-50%,40px) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
/* Login screen */
#admin-login{background:linear-gradient(135deg,#151c18,#1f3a2c,#151c18,#2a4a38);background-size:300% 300%;animation:flow2 12s ease infinite}@keyframes flow2{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
#admin-login form{animation:rv .9s cubic-bezier(.2,.9,.3,1.15) backwards,floaty 6s 1s ease-in-out infinite;box-shadow:0 20px 60px #0008,0 0 0 1px #c5a46d33}@keyframes floaty{50%{transform:translateY(-8px)}}
@media print{body::before{display:none}#sw{display:none}}

/* ================= Occupancy ================= */
.omx th{white-space:nowrap}.od{white-space:nowrap}.od b{display:block}.od small,.ot small{color:var(--mut)}.omx tr.today td.od{box-shadow:inset 4px 0 0 var(--gold)}
.oc{cursor:pointer;min-width:165px;position:relative;transition:background .25s,box-shadow .25s}.oc:hover{background:#fff6e0}.oc.sel{background:#fff1cf;box-shadow:inset 0 0 0 2px var(--gold)}
.oc .op b,.ot b{font:700 24px "Playfair Display",serif;color:var(--green)}.oc .op small{color:var(--mut)}.or{font-size:12px;color:var(--mut)}.bd{font-style:normal;color:var(--bad);font-weight:700}
.obar{height:7px;border-radius:99px;background:#eee6d6;margin:6px 0 4px;overflow:hidden}.obar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7bb48f,#2e8b57);animation:grow 1s cubic-bezier(.2,.9,.3,1.1) .25s backwards}
.oc.warn .obar i{background:linear-gradient(90deg,#f2c94c,#e39b20)}.oc.full .obar i{background:linear-gradient(90deg,#f0a040,#d9772b)}.oc.over{background:#fdeceb}.oc.over .op b{color:var(--bad)}.oc.over .obar i{background:linear-gradient(90deg,#e0644c,#a4442f);animation:grow 1s .25s backwards,pulseBar 1.4s 1.2s infinite}
@keyframes grow{from{width:0}}@keyframes pulseBar{50%{opacity:.55}}
.oio{display:flex;gap:4px;flex-wrap:wrap}.mu{color:var(--mut)}
.rl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 6px;font-size:13px}.rl input{width:96px;text-align:center;font-weight:700}.rs{margin:0 0 8px;font-size:13px;color:var(--mut)}.ohead{margin:20px 0 10px}
.occd:hover{transform:none;box-shadow:0 1px 6px #0000000d;border-color:var(--line)}.occd.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.2)}@keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(-12deg) translateY(18px)}}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0 14px}.ch{background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:8px 12px;animation:rv .5s cubic-bezier(.2,.9,.3,1.2) backwards}.ch:nth-child(2){animation-delay:.06s}.ch:nth-child(3){animation-delay:.12s}.ch:nth-child(4){animation-delay:.18s}.ch:nth-child(5){animation-delay:.24s}.ch b{display:block;font:700 26px "Playfair Display",serif;color:var(--green)}.ch small{color:var(--mut)}.ch.bad{background:#fdeceb;border-color:#e8b3ad}.ch.bad b{color:var(--bad)}
.sub{font-size:15px;margin:14px 0 6px}

input.li{width:92px;text-align:center;font-weight:700}.ap{display:flex;gap:6px;align-items:center}tr.all td{background:#fffaf0}
.wt{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;background:#eaf3ec;border:1px solid #cfe3d4;color:var(--green);font-size:14px;font-weight:500;line-height:1.4}.wt b{font-weight:700}

.fs{position:relative}.fs.lift{z-index:45}.fs:nth-of-type(5){animation-delay:.24s}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* IMPORTANT: use supabaseClient, not "supabase". The Supabase CDN already exposes a global named supabase. */
const supabaseClient = window.supabase.createClient(
  "https://gulificjlukbghcugnsk.supabase.co",
  "sb_publishable_UJk6_1GAyUlAY_ZR2oQ2ZA_HujBlwAN"
);
const H=["Welina Hotels Bhubaneswar","Marigold Hotels Bhubaneswar","Transitel Hotel Kolkata"];
const HA={
 "Welina Hotels Bhubaneswar":{name:"Welina Hotel",address:"IDCO Plot, 7/4, near Infocity, Industrial Area, Bhubaneswar, Odisha 751021"},
 "Marigold Hotels Bhubaneswar":{name:"Hotel MariGold",address:"KIIT Road, Patia, Bhubaneswar, Odisha"},
 "Transitel Hotel Kolkata":{name:"Transitel - A Boutique Hotel",address:"173/4/5, VIP Road, Kaikhali, Kolkata, West Bengal 700052"}
};
const CATS={"Welina Hotels Bhubaneswar":["Executive","Premium"],"Marigold Hotels Bhubaneswar":["Premium","Luxury"],"Transitel Hotel Kolkata":["Premium","Club"]};
const TABS=["Dashboard","Guests","Hotels","Occupancy","Arrivals","Transport","Data"];
const DEFAULT_CHECKOUT="2026-12-07T11:00"; /* 7 Dec 2026, 11:00 AM */
const EVENT_START="2026-12-01",EVENT_END="2026-12-06"; /* event nights: 01/12/2026 to 06/12/2026 */
const DEFAULT_DATA=()=>({g:[],d:[],v:[],rooms:{}});
let S=DEFAULT_DATA(),tab="Dashboard",q="",hf="",sf="",adminReady=false,curG=null,pvo="portrait",errAct=null,lastTab=null;
const $=id=>document.getElementById(id),dlg=$("dlg"),loginEl=$("admin-login"),loginForm=$("admin-login-form"),loginError=$("admin-login-error");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),ms=t=>t?new Date(t).getTime():NaN;
const D2=t=>{if(!t)return"";const m=String(t).match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/);return m?m[3]+"/"+m[2]+"/"+m[1]+(m[4]?" "+m[4]:""):String(t)};
const f=t=>t?esc(D2(t)):"—",NOW=()=>new Date().toLocaleString("en-IN");
/* date on one line, time on the next (used in narrow PDF columns) */
const DT=t=>{if(!t)return"—";const s=D2(t).split(" ");return esc(s[0])+(s[1]?"<br>"+esc(s[1]):"")};
const det=g=>({d:S.d.find(x=>x.id===g.driver),v:S.v.find(x=>x.id===g.vehicle)});
const dn=id=>(S.d.find(x=>x.id===id)||{}).name||"",vn=id=>{const v=S.v.find(x=>x.id===id);return v?(v.model||v.type)+" — "+v.reg:""};
/* People staying with the primary guest (a room fits 3 including the primary guest) */
const withNames=g=>[g.co1,g.co2].map(x=>(x||"").trim()).filter(Boolean);
const withHtml=g=>{const w=withNames(g);return w.length?`<span class="wt">👥 Staying with: <b>${w.map(esc).join(", ")}</b></span>`:""};
/* "A, B and C" for greetings */
const joinNames=a=>a.length>1?a.slice(0,-1).join(", ")+" and "+a[a.length-1]:(a[0]||"");
const dearNames=g=>joinNames([g.name,...withNames(g)].map(x=>"<b>"+esc(x)+"</b>"));
const plainNames=g=>joinNames([g.name,...withNames(g)]);
/* A guest can have up to two hotel stays; each stay is a segment that counts under its own hotel */
const segs=g=>{const a=[];if(g.hotel)a.push({i:0,hotel:g.hotel,cat:g.cat||"",room:g.room||"",cin:g.cin||"",cout:g.cout||""});if(g.hotel2)a.push({i:1,hotel:g.hotel2,cat:g.cat2||"",room:g.room2||"",cin:g.cin2||"",cout:g.cout2||""});return a};
const noSeg=g=>({i:0,hotel:"",cat:g.cat||"",room:g.room||"",cin:g.cin||"",cout:g.cout||""});
const hotelSort=(a,b)=>{const ha=H.indexOf(a.sg.hotel),hb=H.indexOf(b.sg.hotel);return (ha<0?99:ha)-(hb<0?99:hb)||(ms(a.sg.cin)||Infinity)-(ms(b.sg.cin)||Infinity)||(a.g.name||"").localeCompare(b.g.name||"")};
const toast=(msg,bad)=>{const old=$("ts");if(old)old.remove();const x=document.createElement("div");x.id="ts";if(bad)x.className="bad";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),bad?6000:3500)};

/* ---- Red animated error box (inside the open dialog, or as a banner at the top of the screen) ---- */
function markErr(k){const w=$("dd_"+k),el=w?w.querySelector(".ddb"):$("f_"+k);if(!el)return;el.classList.remove("errf");void el.offsetWidth;el.classList.add("errf");el.scrollIntoView({block:"center",behavior:"smooth"});const clr=()=>{el.classList.remove("errf");dlg.removeEventListener("input",clr);dlg.removeEventListener("change",clr)};dlg.addEventListener("input",clr);dlg.addEventListener("change",clr)}
function showErr(msg,opts={}){
 document.querySelectorAll(".err").forEach(x=>x.remove());
 const inDlg=dlg.open,box=document.createElement("div");box.className="err"+(inDlg?"":" fx");box.setAttribute("role","alert");
 errAct=opts.action?opts.action.fn:null;
 box.innerHTML=`<span class="ei">⚠</span><div class="em"><b>${esc(opts.title||"Please fix this")}</b>${esc(msg)}</div>${opts.action?`<button type="button" class="ea" onclick="if(errAct)errAct()">${esc(opts.action.label)}</button>`:""}<button type="button" class="ex" aria-label="Dismiss" onclick="this.closest('.err').remove()">✕</button>`;
 if(inDlg){dlg.insertBefore(box,dlg.firstChild);dlg.scrollTop=0}else{document.body.appendChild(box);setTimeout(()=>box.remove(),7000)}
 if(opts.field)markErr(opts.field);
 return false;
}

function showLogin(message=""){adminReady=false;lastTab=null;loginEl.style.display="flex";$("nav").hidden=true;$("m").hidden=true;$("admin-signout").hidden=true;loginError.textContent=message}
function showApp(){loginEl.style.display="none";$("nav").hidden=false;$("m").hidden=false;$("admin-signout").hidden=false}
async function load(){
 const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
 if(sessionError)throw sessionError;if(!sessionData.session)throw new Error("Please sign in to continue.");
 const {data,error}=await supabaseClient.from("wedding_app_data").select("data").eq("id",1).maybeSingle();
 if(error)throw error;const saved=data&&data.data?data.data:DEFAULT_DATA();
 return {g:Array.isArray(saved.g)?saved.g:[],d:Array.isArray(saved.d)?saved.d:[],v:Array.isArray(saved.v)?saved.v:[],rooms:saved.rooms&&typeof saved.rooms==="object"?saved.rooms:{}};
}
async function save(){
 if(!adminReady){toast("Please sign in before saving.",true);return false}
 try{
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;
  if(!sessionData.session)throw new Error("Your session expired. Please sign in again.");
  const {error}=await supabaseClient.from("wedding_app_data").upsert({id:1,data:S,updated_at:new Date().toISOString()},{onConflict:"id"});
  if(error)throw error;toast("Saved successfully to Supabase");return true;
 }catch(error){console.error("Save failed:",error);showErr(error.message||"Unknown error",{title:"Save failed"});return false}
}
async function startAdminApp(){
 try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;
  if(!data.session){S=DEFAULT_DATA();showLogin();return}
  S=await load();adminReady=true;showApp();render();
 }catch(error){console.error("Authentication/data load failed:",error);showLogin("Signed in, but dashboard data could not load: "+(error.message||"Unknown error")+". Check that the wedding_app_data table and its authenticated-user policies exist in Supabase.")}
}
async function signOutAdmin(){const {error}=await supabaseClient.auth.signOut();if(error){toast(error.message||"Could not sign out",true);return}adminReady=false;S=DEFAULT_DATA();showLogin()}
loginForm.addEventListener("submit",async event=>{
 event.preventDefault();const email=$("admin-email").value.trim(),password=$("admin-password").value,button=loginForm.querySelector('button[type="submit"]');
 button.disabled=true;button.textContent="Signing in…";loginError.textContent="";
 try{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await startAdminApp()}
 catch(error){showLogin(error.message||"Sign-in failed. Check your email and password.")}
 finally{button.disabled=false;button.textContent="Sign in"}
});
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"||!session){S=DEFAULT_DATA();showLogin()}});
/* Navigation: buttons are built once so the sliding pill indicator can glide between tabs */
function nav(){const n=$("nav");if(!n.querySelector("button")){n.innerHTML='<span id="ni"></span>'+TABS.map(t=>`<button data-t="${t}" onclick="tab='${t}';render()">${esc(t)}</button>`).join("")}n.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));moveNi()}
function moveNi(){const n=$("nav"),b=n.querySelector("button.on"),i=$("ni");if(!b||!i)return;i.style.width=b.offsetWidth+"px";i.style.transform="translateX("+b.offsetLeft+"px)";n.scrollTo({left:b.offsetLeft-(n.clientWidth-b.offsetWidth)/2,behavior:"smooth"})}
addEventListener("resize",moveNi);
function render(){
 if(!adminReady)return;nav();$("m").innerHTML=V[tab]();
 if(tab==="Dashboard"||tab==="Occupancy")setTimeout(()=>document.querySelectorAll("[data-n]").forEach(count),0);
 /* Only animate when the section changes (not on every keystroke or status change) */
 if(tab!==lastTab){const dir=TABS.indexOf(tab)>=TABS.indexOf(lastTab??tab)?1:-1;lastTab=tab;animateIn(dir);sweep()}
}
/* Staggered, direction-aware entrance: blocks fly in from the side you are navigating towards */
function animateIn(dir){const m=$("m");m.style.setProperty("--dx",(dir*80)+"px");let i=0;m.querySelectorAll(":scope>*:not(.grid), .grid>*, tbody tr, .card .row").forEach(el=>{el.style.setProperty("--i",Math.min(i++,28));el.classList.add("rv")})}
/* Gold light-sweep across the top of the screen on every section change */
function sweep(){const old=$("sw");if(old)old.remove();const x=document.createElement("div");x.id="sw";document.body.appendChild(x);setTimeout(()=>x.remove(),900)}
/* Ripple on every green/outline button */
document.addEventListener("click",e=>{const b=e.target.closest("button.b");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=document.createElement("span");sp.className="rip";sp.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";b.appendChild(sp);setTimeout(()=>sp.remove(),650)});
function count(el){const n=+el.dataset.n;let i=0;const step=()=>{i++;el.textContent=Math.round(n*Math.min(1,i/18));if(i<18)requestAnimationFrame(step)};if(matchMedia("(prefers-reduced-motion:reduce)").matches)el.textContent=n;else step()}
function stat(label,n){return `<div class="card stat"><b data-n="${n}">0</b><small>${esc(label)}</small></div>`}
const missing=g=>g.aMethod&&(!g.aAt||!g.aPlace||(["Flight","Train"].includes(g.aMethod)&&!g.aNum));
const needsPick=g=>g.pickup!=="No"&&g.aMethod&&(!g.driver||!g.vehicle);
const SC={"Expected":"background:#fff2cc;color:#805b00","Checked in":"background:#ddf3e4;color:#17663a","Checked out":"background:#fce3e3;color:#a12626","Cancelled":"background:#eee;color:#555"};
function stSel(x){return `<select aria-label="Guest status" style="padding:5px 8px;font-size:12px;font-weight:600;${SC[x.status]||""}" onchange="setSt('${esc(x.id)}',this.value)">${["Expected","Checked in","Checked out","Cancelled"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select>`}
function setSt(id,status){const g=S.g.find(x=>x.id===id);if(!g)return;const n=new Date().toISOString().slice(0,16);g.status=status;if(status==="Checked in")g.cinAct=n;if(status==="Checked out")g.coutAct=n;save();render()}
function goSt(status){sf=status;hf="";q="";tab="Guests";render()}
const V={
Dashboard(){
 const g=S.g,t=today(),stats=[["Arriving today",g.filter(x=>(x.aAt||"").startsWith(t)).length],["Checking out today",g.filter(x=>(x.cout||"").startsWith(t)).length],["By flight",g.filter(x=>x.aMethod==="Flight").length],["By train",g.filter(x=>x.aMethod==="Train").length],["Pickups needing driver/vehicle",g.filter(needsPick).length],["Incomplete records",g.filter(x=>missing(x)||!x.hotel||!x.room).length]],up=g.filter(x=>x.aAt).sort((a,b)=>ms(a.aAt)-ms(b.aAt)).slice(0,8);
 return `<div class="bar"><button class="b" onclick="gForm()">+ Add guest</button><button class="b g" onclick="tab='Transport';render()">Drivers &amp; vehicles</button><button class="b g" onclick="adminPdf()">Export admin PDF</button></div>
 <div class="grid">${[["Total guests","", "#c5a46d"],["Expected","Expected","#f2c94c"],["Checked in","Checked in","#2e8b57"],["Checked out","Checked out","#c0392b"]].map(x=>`<button class="card stat" style="text-align:left;border-top:4px solid ${x[2]}" onclick="goSt('${x[1]}')"><b data-n="${x[1]?g.filter(y=>y.status===x[1]).length:g.length}">0</b><small>${x[0]}</small></button>`).join("")}</div>
 <div class="grid">${stats.map(x=>stat(x[0],x[1])).join("")}</div><h2>Guests per hotel</h2><div class="grid">${H.map(h=>`<div class="card"><b>${esc(h)}</b><br><small>${g.filter(x=>segs(x).some(s=>s.hotel===h)).length} guests</small></div>`).join("")}</div>
 <h2>Upcoming arrivals</h2><div class="card">${up.length?up.map(x=>`<div class="row"><span><b>${esc(x.name)}</b> · ${esc([x.aMethod,x.aName,x.aNum].filter(Boolean).join(" "))}</span><span>${f(x.aAt)}</span><button class="b s" onclick="gForm('${x.id}')">Edit</button></div>`).join(""):'<div class="empty">No arrivals recorded yet. Add a guest with arrival details.</div>'}</div>`;
},
Guests(){
 const items=[];
 S.g.forEach(g=>{const ss=segs(g),use=ss.length?ss:[noSeg(g)];use.forEach(sg=>{
  if(hf&&sg.hotel!==hf)return;if(sf&&g.status!==sf)return;
  if(q&&![g.name,g.co1,g.co2,g.phone,sg.hotel,sg.room,g.aNum,g.aName].join(" ").toLowerCase().includes(q.toLowerCase()))return;
  items.push({g,sg,n:ss.length})})});
 items.sort(hotelSort);
 const cnt={};items.forEach(x=>{cnt[x.sg.hotel]=(cnt[x.sg.hotel]||0)+1});let last=null;
 const rows=items.map(({g:x,sg,n})=>{const head=sg.hotel!==last?(last=sg.hotel,`<tr class="grp"><td colspan="6"><b>${esc(sg.hotel||"No hotel assigned")}</b> · ${cnt[sg.hotel]} booking${cnt[sg.hotel]===1?"":"s"} · earliest check-in first</td></tr>`):"";
  return head+`<tr><td><b>${esc(x.name)}</b>${x.vip==="Yes"?' <span class="tag warn">VIP</span>':""}<br><small>${esc(x.phone)} · ${esc(x.pax||1)} pax</small>${withHtml(x)}</td><td>${esc(sg.hotel)||'<span class="tag bad">No hotel</span>'}${n>1?`<br><span class="tag">Hotel ${sg.i+1} of ${n}</span>`:""}</td><td><span class="room">${esc(sg.room)||"—"}</span><br><small>${esc(sg.cat)||"Category not set"}</small></td><td><small>In ${f(sg.cin)}<br>Out ${f(sg.cout)}</small></td><td>${stSel(x)}</td><td><button class="b s" onclick="gForm('${x.id}')">Edit</button> <button class="b s" onclick="sheet('${x.id}')">Send / PDF</button> <button class="b g s" onclick="del('${x.id}')">Delete</button></td></tr>`}).join("");
 return `<div class="bar"><input id="qs" placeholder="Search name, phone, room, flight/train" value="${esc(q)}" oninput="q=this.value;keep()"><select aria-label="Status filter" onchange="sf=this.value;render()"><option value="">All statuses</option>${["Expected","Checked in","Checked out","Cancelled"].map(s=>`<option ${s===sf?"selected":""}>${s}</option>`).join("")}</select><select onchange="hf=this.value;render()"><option value="">All hotels</option>${H.map(h=>`<option ${h===hf?"selected":""}>${esc(h)}</option>`).join("")}</select><button class="b" onclick="gForm()">+ Add guest</button><button class="b g" onclick="adminPdf()">Export all (PDF)</button><button class="b g" onclick="csv()">Prepare CSV</button></div>
 <div class="tw"><table><thead><tr><th>Guest</th><th>Hotel</th><th>Room</th><th>Stay</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No guests found. Use Add guest to start.</td></tr>'}</tbody></table></div>`;
},
Hotels(){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">${H.map(h=>{const g=S.g.filter(x=>segs(x).some(s=>s.hotel===h)),info=HA[h];return `<div class="card"><h3>${esc(h)}</h3><small>${esc(info.address)}</small><div class="bar" style="margin-top:12px"><span class="tag expected">Expected ${g.filter(x=>x.status==="Expected").length}</span><span class="tag in">Checked in ${g.filter(x=>x.status==="Checked in").length}</span><span class="tag out">Checked out ${g.filter(x=>x.status==="Checked out").length}</span></div><button class="b s" onclick="hf='${h}';sf='';tab='Guests';render()">Open guest list</button> <button class="b g s" onclick="hotelPdf('${h}')">Export for hotel (PDF)</button>${g.length?g.map(x=>{const sg=segs(x).find(s=>s.hotel===h)||{};return `<div class="row"><b>${esc(x.name)}</b>${sg.room?`<span class="room">${esc(sg.room)}</span>`:'<span class="tag warn">Room not assigned</span>'}<small style="flex-basis:100%">${esc(sg.cat)||"Category not set"}${withNames(x).length?" · with "+esc(withNames(x).join(", ")):""}</small>${stSel(x)}</div>`}).join(""):'<div class="empty">No guests assigned.</div>'}</div>`}).join("")}</div>`},
Occupancy(){
 const o=occData();occSelDefault(o);
 const sk=o.skipped.length?`<div class="card" style="border-color:#e0b25a;background:#fffaf0"><b>${o.skipped.length} booking${o.skipped.length===1?"":"s"} not counted</b><div style="margin-top:6px">${o.skipped.map(g=>`<span class="tag warn">${esc(g.name)} — ${skipWhy(g)} <button class="b g s" style="margin-left:4px" onclick="gForm('${g.id}')">Fix</button></span>`).join(" ")}</div></div>`:"";
 return `<div class="bar"><small>Event: ${dmy(EVENT_START)} – ${dmy(EVENT_END)}. Enter how many rooms each hotel has available on each night. A guest is counted on every night from check-in up to, but not including, the check-out day, using the "Rooms required" set on the guest (default 1). Click any cell below to see who is staying.</small></div>${occLimits(o)}<div class="grid" id="occ-cards" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${occCards(o)}</div>${sk}<h2 class="ohead">Day-by-day occupancy</h2><div class="tw" id="occ-matrix">${occMatrix(o)}</div><div id="occ-detail" class="card occd" style="margin-top:16px">${occDetail()}</div>`;
},
Arrivals(){
 const list=S.g.filter(x=>x.aMethod).sort((a,b)=>ms(a.aAt)-ms(b.aAt));
 return `<div class="bar"><small>Arrival time is when the flight/train lands. Driver reporting time is when the driver must be at the pickup point.</small></div><div class="tw"><table><thead><tr><th>Guest</th><th>Arrival</th><th>Reporting</th><th>Pickup</th><th>Flags / actions</th></tr></thead><tbody>${list.length?list.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.pax||1)} pax → ${esc(x.hotel)}</small>${withHtml(x)}</td><td>${f(x.aAt)}<br><small>${esc([x.aMethod,x.aName,x.aNum].filter(Boolean).join(" "))} · ${esc(x.aPlace)}</small></td><td>${f(x.rep)}</td><td>${esc(dn(x.driver))||"—"}<br><small>${esc(vn(x.vehicle))}</small></td><td>${!x.driver?'<span class="tag bad">No driver</span>':""}${!x.vehicle?'<span class="tag bad">No vehicle</span>':""}${missing(x)?'<span class="tag warn">Missing info</span>':""}${x.driver&&x.vehicle?'<span class="tag ok">Assigned</span>':""}<br><button class="b g s" onclick="gForm('${x.id}')">Edit</button> <button class="b s" onclick="sheet('${x.id}')">Send / PDF</button></td></tr>`).join(""):'<tr><td colspan="5" class="empty">No arrivals yet.</td></tr>'}</tbody></table></div>`;
},

/* ---- Occupancy planner: people and rooms per hotel per night ---- */
let occHi=-1,occD="";
const addDay=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const wd=d=>new Date(d+"T00:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",timeZone:"UTC"});
const dmy=d=>d.split("-").reverse().join("/");
const skipWhy=g=>!g.hotel?"no hotel":(!g.cin||!g.cout)?"no check-in/out":(g.hotel2&&(!g.cin2||!g.cout2))?"second hotel dates missing":"check-out before check-in";
function occData(){
 const bk=[],skipped=[];
 S.g.forEach(g=>{if(g.status==="Cancelled")return;const ss=segs(g);if(!ss.length){skipped.push(g);return}let bad=false;ss.forEach(sg=>{const hi=H.indexOf(sg.hotel),a=(sg.cin||"").slice(0,10),b=(sg.cout||"").slice(0,10);if(hi<0||!a||!b||b<a){bad=true;return}bk.push({g,sg,hi,a,b,pax:+g.pax||1,rooms:Math.max(1,+g.rooms||1)})});if(bad)skipped.push(g)});
 let lo=EVENT_START,hi=EVENT_END;bk.forEach(x=>{if(x.a<lo)lo=x.a;if(x.b>hi)hi=x.b});
 const rows=[];
 for(let d=lo,n=0;d<=hi&&n<150;d=addDay(d,1),n++){rows.push({d,cells:H.map((h,k)=>{const stay=bk.filter(x=>x.hi===k&&x.a<=d&&(d<x.b||(x.a===x.b&&d===x.a))),ins=bk.filter(x=>x.hi===k&&x.a===d),outs=bk.filter(x=>x.hi===k&&x.b===d&&x.b>x.a);return{stay,ins,outs,people:stay.reduce((n2,x)=>n2+x.pax,0),rooms:stay.reduce((n2,x)=>n2+x.rooms,0)}})})}
 return{rows,skipped,bk};
}
/* Rooms available at a hotel on a given night (older saved data may hold a single number per hotel) */
function capOf(h,d){const v=(S.rooms||{})[h];if(v&&typeof v==="object")return +v[d]||0;return +v||0}
/* Nights shown in the limits table: every event night, plus any later night that has guests */
function occNights(o){return o.rows.filter(r=>r.d<=EVENT_END||r.cells.some(c=>c.stay.length))}
function occLimits(o){
 const ns=occNights(o);
 return `<h2 class="ohead">Rooms available each night</h2><div class="tw" id="occ-limits"><table class="omx"><thead><tr><th>Night</th>${H.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${ns.map(r=>`<tr><td class="od"><b>${wd(r.d)}</b><small>${r.d.slice(0,4)}</small></td>${H.map((h,hi)=>`<td><input class="li" type="number" min="0" inputmode="numeric" id="lim_${hi}_${r.d}" value="${capOf(h,r.d)||""}" placeholder="0" onchange="setLimit(${hi},'${r.d}',this.value)"></td>`).join("")}</tr>`).join("")}<tr class="all"><td class="od"><b>All nights</b><small>fill every night</small></td>${H.map((h,hi)=>`<td><span class="ap"><input class="li" type="number" min="0" inputmode="numeric" id="all_${hi}" placeholder="rooms"><button class="b s" onclick="setAllLimits(${hi})">Apply</button></span></td>`).join("")}</tr></tbody></table></div>`;
}
function occCards(o){
 const ns=occNights(o);
 return H.map((h,hi)=>{let used=0,avail=0,over=0,unset=0,pk=0,pp=0;
  ns.forEach(r=>{const c=r.cells[hi],cap=capOf(h,r.d);used+=c.rooms;avail+=cap;pk=Math.max(pk,c.rooms);pp=Math.max(pp,c.people);if(cap&&c.rooms>cap)over++;if(!cap&&c.rooms)unset++});
  return `<div class="card"><h3 style="font-size:17px">${esc(h)}</h3><p class="rs">Room-nights booked: <b>${used}</b>${avail?` of <b>${avail}</b>`:""}<br>Busiest night: <b>${pk}</b> room${pk===1?"":"s"} · <b>${pp}</b> people</p>${over?`<span class="tag bad">Over the limit on ${over} night${over===1?"":"s"}</span>`:unset?`<span class="tag warn">Limit not set for ${unset} night${unset===1?"":"s"}</span>`:avail?'<span class="tag ok">Within limits</span>':'<span class="tag warn">Set the nightly limits above</span>'}</div>`}).join("");
}
function occMatrix(o){
 const t=today(),head=`<tr><th>Date</th>${H.map(h=>`<th>${esc(h)}</th>`).join("")}<th>Total</th></tr>`;
 const body=o.rows.map(r=>{const tp=r.cells.reduce((n,c)=>n+c.people,0),tr=r.cells.reduce((n,c)=>n+c.rooms,0);
  return `<tr class="${r.d===t?"today":""}"><td class="od"><b>${wd(r.d)}</b><small>${r.d.slice(0,4)}${r.d===t?" · today":""}</small></td>${r.cells.map((c,hi)=>{const cap=capOf(H[hi],r.d),pct=cap?Math.min(100,Math.round(c.rooms/cap*100)):0,st=!cap?"":c.rooms>cap?"over":(c.rooms===cap&&c.rooms>0)?"full":pct>=75?"warn":"",free=cap?cap-c.rooms:0,empty=!c.people&&!c.ins.length&&!c.outs.length&&!cap;
   return `<td class="oc ${st} ${occHi===hi&&occD===r.d?"sel":""}" data-h="${hi}" data-d="${r.d}" onclick="occPick(${hi},'${r.d}')">${empty?'<span class="mu">—</span>':`<div class="op"><b data-n="${c.people}">0</b> <small>people</small></div><div class="or">${c.rooms} room${c.rooms===1?"":"s"}${cap?` of ${cap} · ${free<0?`<em class="bd">over by ${-free}</em>`:`${free} free`}`:""}</div>${cap&&c.rooms?`<div class="obar"><i style="width:${pct}%"></i></div>`:""}<div class="oio">${c.ins.length?`<span class="tag in">↓ ${c.ins.length} in</span>`:""}${c.outs.length?`<span class="tag out">↑ ${c.outs.length} out</span>`:""}</div>`}</td>`}).join("")}<td class="ot"><b>${tp}</b><small> people</small><div class="or">${tr} room${tr===1?"":"s"}</div></td></tr>`}).join("");
 return `<table class="omx"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function refreshOcc(){const o=occData();occSelDefault(o);const a=$("occ-cards"),b=$("occ-matrix"),c=$("occ-detail");if(!a||!b||!c)return;a.innerHTML=occCards(o);b.innerHTML=occMatrix(o);c.innerHTML=occDetail();[a,b,c].forEach(x=>x.querySelectorAll("[data-n]").forEach(count))}
function occSelDefault(o){

function occDetail(){
 const o=occData();occSelDefault(o);const r=o.rows.find(x=>x.d===occD);if(!r)return"";
 const c=r.cells[occHi],h=H[occHi],cap=capOf(h,occD),free=cap?cap-c.rooms:0;
 const chip=(n,l,cls)=>`<div class="ch ${cls||""}"><b data-n="${n}">0</b><small>${l}</small></div>`;
 const list=[...c.stay].sort((a,b)=>a.a.localeCompare(b.a)||(a.g.name||"").localeCompare(b.g.name||""));
 const rows=list.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.g.name)}</b>${x.g.vip==="Yes"?' <span class="tag warn">VIP</span>':""}${x.a===occD?' <span class="tag in">Arriving</span>':""}${withHtml(x.g)}</td><td>${esc(x.g.phone)||"—"}</td><td>${x.pax}</td><td>${x.rooms}</td><td>${esc(x.sg.cat)||"—"}</td><td>${esc(x.sg.room)||"—"}</td><td>${f(x.sg.cin)}</td><td>${f(x.sg.cout)}</td><td><span class="tag ${stCls(x.g.status)}">${esc(x.g.status)}</span></td></tr>`).join("");
 const outs=c.outs.length?`<h3 class="sub">Checking out on the morning of ${dmy(occD)}</h3><div>${c.outs.map(x=>`<span class="tag out">${esc(x.g.name)} · ${x.pax} pax · ${x.rooms} room${x.rooms===1?"":"s"}${x.sg.room?" · "+esc(x.sg.room):""}</span>`).join(" ")}</div>`:"";
 return `<div class="bar" style="margin-bottom:0"><h3>${esc(h)}</h3><span class="tag expected">Night of ${wd(occD)} ${occD.slice(0,4)}</span></div><div class="chips">${chip(c.people,"People staying")}${chip(c.rooms,"Rooms used")}${cap?(free<0?chip(-free,"Rooms over limit","bad"):chip(free,"Rooms free")):""}${chip(c.ins.length,"Check-ins")}${chip(c.outs.length,"Check-outs")}</div>${list.length?`<div class="tw"><table><thead><tr><th>#</th><th>Booked by (primary guest)</th><th>Phone</th><th>Pax</th><th>Rooms</th><th>Room category</th><th>Room no.</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="mu" style="padding:6px 0">Nobody is staying at ${esc(h)} on this night.</p>`}${outs}`;
}
function occPick(hi,d){
 occHi=hi;occD=d;document.querySelectorAll(".oc.sel").forEach(x=>x.classList.remove("sel"));
 const c=document.querySelector('.oc[data-h="'+hi+'"][data-d="'+d+'"]');if(c)c.classList.add("sel");

function limMut(h,fn){S.rooms=S.rooms||{};let cur=S.rooms[h];if(!cur||typeof cur!=="object"){const base=+cur||0,o={};if(base>0)occData().rows.forEach(r=>{o[r.d]=base});cur=S.rooms[h]=o}fn(cur)}

/* ---- Animated custom dropdowns (a hidden real <select id="f_x"> keeps the value; the visible control is #dd_x) ---- */

/* Open the list upward when there is not enough room below (above the sticky Save/Cancel bar) and size it to fit */
function ddPlace(w){
 const l=w.querySelector(".ddl"),b=w.querySelector(".ddb"),bar=dlg.querySelector(".fb"),dr=dlg.getBoundingClientRect(),br=b.getBoundingClientRect();

function catOpts(h,current){const list=[...(CATS[h]||[])];if(current&&!list.includes(current))list.push(current);return [["","— select —"],...list.map(x=>[x,x])]}
function placeOpts(current){const list=["Bhubaneswar Airport","Bhubaneswar Railway Station","Kolkata Airport","Howrah Station","Sealdah Station"];if(current&&!list.includes(current))list.push(current);return [["","— select —"],...list.map(x=>[x,x])]}
function sameTrip(a,b){return !!a.aPlace&&a.aPlace.trim().toLowerCase()===String(b.aPlace||"").trim().toLowerCase()&&Math.abs(ms(a.rep)-ms(b.rep))<=30*60*1000}
function roomClash(o,others){
 if(["Checked out","Cancelled"].includes(o.status))return null;
 for(const a of segs(o)){if(!a.room)continue;
  for(const x of others){if(["Checked out","Cancelled"].includes(x.status))continue;
   for(const b of segs(x)){if(b.hotel===a.hotel&&(b.room||"").trim().toLowerCase()===a.room.trim().toLowerCase()&&(!(a.cin&&a.cout&&b.cin&&b.cout)||(ms(a.cin)<ms(b.cout)&&ms(b.cin)<ms(a.cout))))return{g:x,hotel:a.hotel,room:a.room}}}}
 return null;
}
function driverClash(o,others){if(!o.driver||!o.rep)return null;return others.find(x=>x.driver===o.driver&&x.rep&&Math.abs(ms(x.rep)-ms(o.rep))<2*60*60*1000&&!sameTrip(o,x))||null}
function capacityClash(o,others){if(!o.driver||!o.vehicle||!o.rep)return null;const vehicle=S.v.find(v=>v.id===o.vehicle);if(!vehicle)return null;const group=others.filter(x=>x.driver===o.driver&&x.vehicle===o.vehicle&&x.rep&&sameTrip(o,x));const used=group.reduce((n,x)=>n+(+x.pax||1),0)+(+o.pax||1);return used>+vehicle.cap?{used,cap:+vehicle.cap,vehicle,group}:null}

 const pages=drivers.map((d,i)=>{const trips=S.g.filter(g=>g.driver===d.id).sort((a,b)=>ms(a.rep)-ms(b.rep));
  /* Arrival: time in bold first, then the pickup point in brackets, then the flight/train details */
  const rows=trips.map(g=>{const info=[g.aMethod,g.aName,g.aNum].filter(Boolean).join(" ");return `<tr><td><b>${esc(g.name)}</b>${withNames(g).length?"<br><small>with "+esc(withNames(g).join(", "))+"</small>":""}</td><td>${esc(g.phone)}</td><td>${esc(g.pax||1)}</td><td>${arrivalBox(g,info)}</td><td>${esc(g.hotel)}</td><td>${esc(vn(g.vehicle))}</td><td>${esc(g.notes)}</td></tr>`}).join("");
  return `<div style="${i?'break-before:page;page-break-before:always':''}">${HDR("Driver Duty Sheet")}<div class="dv"><div style="font-size:22px;font-weight:800">🚗 ${esc(d.name)}</div><div>📞 Phone: ${esc(d.phone)}</div><p class="ft">🧳 Assigned trips: ${trips.length} · Generated ${esc(NOW())}</p></div><table><thead><tr><th>👤 Guest</th><th>📞 Phone</th><th>👥 Pax</th><th style="width:30%">🛬 Arrival</th><th>🏨 Drop at hotel</th><th>🚙 Vehicle</th><th>📝 Notes</th></tr></thead><tbody>${rows}</tbody></table><p class="ft">⏰ Please reach the pickup point at the reporting time and keep guest phone numbers handy.</p></div>`}).join("");
 pv(pages,"landscape");
}
function redPop(title,message){dlg.innerHTML=`<h2>⚠ ${esc(title)}</h2><p>${esc(message)}</p><button class="b" onclick="dlg.close()">OK</button>`;dlg.showModal()}
startAdminApp();
</script>
