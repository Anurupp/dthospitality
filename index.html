<body>
<header><h1>Wedding Hospitality Concierge</h1><span>Guests · Hotels · Arrivals · Transport</span><div class="spacer"></div><button id="admin-signout" class="b g" hidden onclick="signOutAdmin()">Sign out</button></header>
<div id="admin-login"><form id="admin-login-form"><h2>Wedding Admin</h2><p>Sign in to manage wedding guests, hotels and transport.</p><label for="admin-email">Administrator email</label><input id="admin-email" type="email" autocomplete="username" required><label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><p id="admin-login-error" role="alert"></p></form></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* IMPORTANT: use supabaseClient, not "supabase". The Supabase CDN already exposes a global named supabase. */
const supabaseClient = window.supabase.createClient(
  "https://gulificjlukbghcugnsk.supabase.co",
  "sb_publishable_UJk6_1GAyUlAY_ZR2oQ2ZA_HujBlwAN"
);
const H=["Welina Hotels Bhubaneswar","Marigold Hotels Bhubaneswar","Transitel Hotel Kolkata"];
const HA={
 "Welina Hotels Bhubaneswar":{name:"Welina Hotel",address:"IDCO Plot, 7/4, near Infocity, Industrial Area, Bhubaneswar, Odisha 751021"},
 "Marigold Hotels Bhubaneswar":{name:"Hotel MariGold",address:"KIIT Road, Patia, Bhubaneswar, Odisha"},
 "Transitel Hotel Kolkata":{name:"Transitel - A Boutique Hotel",address:"173/4/5, VIP Road, Kaikhali, Kolkata, West Bengal 700052"}
};

const DEFAULT_CHECKOUT="2026-12-07T11:00"; /* 7 Dec 2026, 11:00 AM */
const DEFAULT_DATA=()=>({g:[],d:[],v:[]});
let S=DEFAULT_DATA(),tab="Dashboard",q="",hf="",sf="",adminReady=false,curG=null,pvo="portrait";
const $=id=>document.getElementById(id),dlg=$("dlg"),loginEl=$("admin-login"),loginForm=$("admin-login-form"),loginError=$("admin-login-error");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),ms=t=>t?new Date(t).getTime():NaN;
const D2=t=>{if(!t)return"";const m=String(t).match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/);return m?m[3]+"/"+m[2]+"/"+m[1]+(m[4]?" "+m[4]:""):String(t)};
const f=t=>t?esc(D2(t)):"—",NOW=()=>new Date().toLocaleString("en-IN");
const det=g=>({d:S.d.find(x=>x.id===g.driver),v:S.v.find(x=>x.id===g.vehicle)});
const dn=id=>(S.d.find(x=>x.id===id)||{}).name||"",vn=id=>{const v=S.v.find(x=>x.id===id);return v?(v.model||v.type)+" — "+v.reg:""};

function showLogin(message=""){adminReady=false;loginEl.style.display="flex";$("nav").hidden=true;$("m").hidden=true;$("admin-signout").hidden=true;loginError.textContent=message}
function showApp(){loginEl.style.display="none";$("nav").hidden=false;$("m").hidden=false;$("admin-signout").hidden=false}
async function load(){
 const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
 if(sessionError)throw sessionError;if(!sessionData.session)throw new Error("Please sign in to continue.");
 const {data,error}=await supabaseClient.from("wedding_app_data").select("data").eq("id",1).maybeSingle();
 if(error)throw error;const saved=data&&data.data?data.data:DEFAULT_DATA();
 return {g:Array.isArray(saved.g)?saved.g:[],d:Array.isArray(saved.d)?saved.d:[],v:Array.isArray(saved.v)?saved.v:[]};
}
async function save(){
 if(!adminReady){toast("Please sign in before saving.");return false}
 try{
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;
  if(!sessionData.session)throw new Error("Your session expired. Please sign in again.");
  const {error}=await supabaseClient.from("wedding_app_data").upsert({id:1,data:S,updated_at:new Date().toISOString()},{onConflict:"id"});
  if(error)throw error;toast("Saved successfully to Supabase");return true;
 }catch(error){console.error("Save failed:",error);toast("Save failed: "+(error.message||"Unknown error"));return false}
}
async function startAdminApp(){
 try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;
  if(!data.session){S=DEFAULT_DATA();showLogin();return}
  S=await load();adminReady=true;showApp();render();
 }catch(error){console.error("Authentication/data load failed:",error);showLogin("Signed in, but dashboard data could not load: "+(error.message||"Unknown error")+". Check that the wedding_app_data table and its authenticated-user policies exist in Supabase.")}
}
async function signOutAdmin(){const {error}=await supabaseClient.auth.signOut();if(error){toast(error.message||"Could not sign out");return}adminReady=false;S=DEFAULT_DATA();showLogin()}
loginForm.addEventListener("submit",async event=>{
 event.preventDefault();const email=$("admin-email").value.trim(),password=$("admin-password").value,button=loginForm.querySelector('button[type="submit"]');
 button.disabled=true;button.textContent="Signing in…";loginError.textContent="";
 try{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await startAdminApp()}
 catch(error){showLogin(error.message||"Sign-in failed. Check your email and password.")}
 finally{button.disabled=false;button.textContent="Sign in"}
});
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"||!session){S=DEFAULT_DATA();showLogin()}});
function nav(){$("nav").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" onclick="tab='${t}';render()">${esc(t)}</button>`).join("")}
function render(){if(!adminReady)return;nav();$("m").innerHTML=V[tab]();if(tab==="Dashboard")setTimeout(()=>document.querySelectorAll("[data-n]").forEach(count),0)}
function count(el){const n=+el.dataset.n;let i=0;const step=()=>{i++;el.textContent=Math.round(n*Math.min(1,i/18));if(i<18)requestAnimationFrame(step)};if(matchMedia("(prefers-reduced-motion:reduce)").matches)el.textContent=n;else step()}

const needsPick=g=>g.pickup!=="No"&&g.aMethod&&(!g.driver||!g.vehicle);

function setSt(id,status){const g=S.g.find(x=>x.id===id);if(!g)return;const n=new Date().toISOString().slice(0,16);g.status=status;if(status==="Checked in")g.cinAct=n;if(status==="Checked out")g.coutAct=n;save();render()}
function goSt(status){sf=status;hf="";q="";tab="Guests";render()}
const V={
Dashboard(){
 const g=S.g,t=today(),stats=[["Arriving today",g.filter(x=>(x.aAt||"").startsWith(t)).length],["Checking out today",g.filter(x=>(x.cout||"").startsWith(t)).length],["By flight",g.filter(x=>x.aMethod==="Flight").length],["By train",g.filter(x=>x.aMethod==="Train").length],["Pickups needing driver/vehicle",g.filter(needsPick).length],["Incomplete records",g.filter(x=>missing(x)||!x.hotel||!x.room).length]],up=g.filter(x=>x.aAt).sort((a,b)=>ms(a.aAt)-ms(b.aAt)).slice(0,8);
 return `<div class="bar"><button class="b" onclick="gForm()">+ Add guest</button><button class="b g" onclick="tab='Transport';render()">Drivers &amp; vehicles</button><button class="b g" onclick="adminPdf()">Export admin PDF</button></div>
 <div class="grid">${[["Total guests","", "#c5a46d"],["Expected","Expected","#f2c94c"],["Checked in","Checked in","#2e8b57"],["Checked out","Checked out","#c0392b"]].map(x=>`<button class="card stat" style="text-align:left;border-top:4px solid ${x[2]}" onclick="goSt('${x[1]}')"><b data-n="${x[1]?g.filter(y=>y.status===x[1]).length:g.length}">0</b><small>${x[0]}</small></button>`).join("")}</div>
 <div class="grid">${stats.map(x=>stat(x[0],x[1])).join("")}</div><h2>Guests per hotel</h2><div class="grid">${H.map(h=>`<div class="card"><b>${esc(h)}</b><br><small>${g.filter(x=>x.hotel===h).length} guests</small></div>`).join("")}</div>
 <h2>Upcoming arrivals</h2><div class="card">${up.length?up.map(x=>`<div class="row"><span><b>${esc(x.name)}</b> · ${esc([x.aMethod,x.aName,x.aNum].filter(Boolean).join(" "))}</span><span>${f(x.aAt)}</span><button class="b s" onclick="gForm('${x.id}')">Edit</button></div>`).join(""):'<div class="empty">No arrivals recorded yet. Add a guest with arrival details.</div>'}</div>`;
},
Guests(){

 return `<div class="bar"><input id="qs" placeholder="Search name, phone, room, flight/train" value="${esc(q)}" oninput="q=this.value;keep()"><select aria-label="Status filter" onchange="sf=this.value;render()"><option value="">All statuses</option>${["Expected","Checked in","Checked out","Cancelled"].map(s=>`<option ${s===sf?"selected":""}>${s}</option>`).join("")}</select><select onchange="hf=this.value;render()"><option value="">All hotels</option>${H.map(h=>`<option ${h===hf?"selected":""}>${esc(h)}</option>`).join("")}</select><button class="b" onclick="gForm()">+ Add guest</button><button class="b g" onclick="adminPdf()">Export all (PDF)</button><button class="b g" onclick="csv()">Prepare CSV</button></div>

/* ---- Animated custom dropdowns (a hidden real <select id="f_x"> keeps the value; the visible control is #dd_x) ---- */
const normOpt=o=>Array.isArray(o)?o:[o,o===""?"— select —":o];
const ddItems=(opts,val)=>opts.map(a=>`<li role="option" tabindex="-1" data-v="${esc(a[0])}" class="${String(val??"")===String(a[0])?"sel ":""}${a[0]===""?"ph":""}">${esc(a[1])}</li>`).join("");
function ddRefresh(id){const s=$(id),w=$("dd_"+id.slice(2));if(!s||!w)return;const opts=[...s.options].map(o=>[o.value,o.textContent]),cur=s.options[s.selectedIndex];w.querySelector("ul").innerHTML=ddItems(opts,s.value);w.querySelector(".ddb span").textContent=cur?cur.textContent:""}
function ddClose(){dlg.querySelectorAll(".dd.open").forEach(x=>{x.classList.remove("open");x.querySelector(".ddb").setAttribute("aria-expanded","false")})}
function ddPick(li){const w=li.closest(".dd"),s=$("f_"+w.id.slice(3));s.value=li.dataset.v;ddRefresh(s.id);ddClose();w.querySelector(".ddb").focus();s.dispatchEvent(new Event("change",{bubbles:true}))}
dlg.addEventListener("click",e=>{
 const b=e.target.closest(".ddb");
 if(b){const w=b.parentElement,wasOpen=w.classList.contains("open");ddClose();if(!wasOpen){w.classList.add("open");b.setAttribute("aria-expanded","true");const sel=w.querySelector("li.sel");if(sel)sel.scrollIntoView({block:"nearest"})}return}
 const li=e.target.closest(".ddl li");if(li){ddPick(li);return}
 ddClose();
});
dlg.addEventListener("keydown",e=>{
 const w=e.target.closest&&e.target.closest(".dd");if(!w)return;
 const open=w.classList.contains("open"),items=[...w.querySelectorAll("li")];
 if(e.key==="Escape"&&open){e.preventDefault();e.stopPropagation();ddClose();w.querySelector(".ddb").focus();return}
 if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!open){ddClose();w.classList.add("open");w.querySelector(".ddb").setAttribute("aria-expanded","true")}const i=items.indexOf(document.activeElement),n=e.key==="ArrowDown"?Math.min(items.length-1,i+1):Math.max(0,i-1);items[n].focus();return}
 if((e.key==="Enter"||e.key===" ")&&e.target.tagName==="LI"){e.preventDefault();ddPick(e.target)}
});

function fieldHtml(value){return ([k,label,type,opts,wide])=>{

 dlg.showModal();dlg.scrollTop=0;

function catOpts(h,current){const list=[...(CATS[h]||[])];if(current&&!list.includes(current))list.push(current);return [["","— select —"],...list.map(x=>[x,x])]}
function placeOpts(current){const list=["Bhubaneswar Airport","Bhubaneswar Railway Station","Kolkata Airport","Howrah Station","Sealdah Station"];if(current&&!list.includes(current))list.push(current);return [["","— select —"],...list.map(x=>[x,x])]}
function sameTrip(a,b){return !!a.aPlace&&a.aPlace.trim().toLowerCase()===String(b.aPlace||"").trim().toLowerCase()&&Math.abs(ms(a.rep)-ms(b.rep))<=30*60*1000}
function roomClash(o,others){if(!o.hotel||!o.room||["Checked out","Cancelled"].includes(o.status))return null;return others.find(x=>x.hotel===o.hotel&&(x.room||"").trim().toLowerCase()===o.room.trim().toLowerCase()&&!["Checked out","Cancelled"].includes(x.status)&&(!(o.cin&&o.cout&&x.cin&&x.cout)||(ms(o.cin)<ms(x.cout)&&ms(x.cin)<ms(o.cout))))||null}
function driverClash(o,others){if(!o.driver||!o.rep)return null;return others.find(x=>x.driver===o.driver&&x.rep&&Math.abs(ms(x.rep)-ms(o.rep))<2*60*60*1000&&!sameTrip(o,x))||null}
function capacityClash(o,others){if(!o.driver||!o.vehicle||!o.rep)return null;const vehicle=S.v.find(v=>v.id===o.vehicle);if(!vehicle)return null;const group=others.filter(x=>x.driver===o.driver&&x.vehicle===o.vehicle&&x.rep&&sameTrip(o,x));const used=group.reduce((n,x)=>n+(+x.pax||1),0)+(+o.pax||1);return used>+vehicle.cap?{used,cap:+vehicle.cap,vehicle,group}:null}

const toLocalInput=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())};

 }

function guestPdf(id){
 const g=S.g.find(x=>x.id===id);if(!g)return;const {d,v}=det(g),info=HA[g.hotel],p=t=>t?esc(D2(t)):"To be confirmed",row=(label,value)=>value?`<tr><th>${esc(label)}</th><td>${esc(value)}</td></tr>`:"",arrival=[g.aMethod,g.aName,g.aNum].filter(Boolean).join(" "),hotel=info?`<table class="pr"><tbody>${row("Hotel",g.hotel)}${row("Address",info.address)}${row("Room number",g.room||"Room Not Assigned")}${row("Check-in",p(g.cin))}${row("Check-out",p(g.cout))}</tbody></table>`:`<table class="pr"><tbody>${row("Hotel",g.hotel||"To be confirmed")}${row("Room number",g.room||"Room Not Assigned")}${row("Check-in",p(g.cin))}${row("Check-out",p(g.cout))}</tbody></table>`;
 let pickup="";if(d){pickup=`<div class="dv"><h2>Your Driver &amp; Pickup</h2><div class="big">${esc(d.name)}</div><div class="ph">${esc(d.phone||"")}</div><table class="pr"><tbody>${row("Car",v?(v.model||v.type)+" — "+v.reg:"Vehicle to be confirmed")}${row("Driver reports at",p(g.rep))}${row("Pickup location",g.aPlace)}${row("Your arrival",arrival)}${row("Arrival time",p(g.aAt))}</tbody></table></div>`}else{pickup=`<div class="dv"><h2>Pickup information</h2><p><b>Driver details will be shared separately.</b></p><p>Please use the hotel address below if no driver has been assigned.</p></div>`}
 const arrivalTable=(arrival||g.aAt)?`<h2>Your Arrival</h2><table class="pr"><tbody>${row("Flight / train",arrival)}${row("Arrival point",g.aPlace)}${row("Arrival time",p(g.aAt))}</tbody></table>`:"";
 pv(HDR("The Wedding Celebrations · December 2026")+`<p style="font-size:15px">Dear <b>${esc(g.name)}</b>,</p>${pickup}${arrivalTable}<h2>Your Stay</h2>${hotel}<div class="ms">We are so happy you could join us in celebrating the wedding of Dhritimaan &amp; Tushali. Safe travels, and see you very soon!<br><br>For assistance / RSVP, please contact Hillol at <b>7894444767</b>.<br><br>With love,<br>Hillol &amp; Tapobrataa</div><p class="ft">Generated ${esc(NOW())}</p>`,"portrait");
}
function adminPdf(){
 const list=[...S.g].sort((a,b)=>(a.hotel||"~").localeCompare(b.hotel||"~")||(a.name||"").localeCompare(b.name||""));
 const rows=list.map(g=>{const {d,v}=det(g);return `<tr><td><b>${esc(g.name)}</b><br>${esc(g.phone)}</td><td>${esc(d?.name||"—")}<br>${esc(d?.phone||"")}</td><td>${esc(v?(v.model||v.type)+" — "+v.reg:"—")}</td><td>${f(g.rep)}</td><td>${esc([g.aMethod,g.aName,g.aNum].filter(Boolean).join(" "))}<br>${esc(g.aPlace)}<br>${f(g.aAt)}</td><td>${esc(g.hotel)}</td><td>${esc(g.room||"—")}<br>${esc(g.cat||"")}</td><td>In ${f(g.cin)}<br>Out ${f(g.cout)}</td><td>${esc(g.status)}</td></tr>`}).join("");
 const roster=S.d.map(d=>{const trips=S.g.filter(g=>g.driver===d.id).sort((a,b)=>ms(a.rep)-ms(b.rep));return trips.length?`<h2>${esc(d.name)} · ${esc(d.phone)}</h2><table><thead><tr><th>Reporting</th><th>Guest</th><th>Phone</th><th>Pickup point</th><th>Vehicle</th><th>Hotel</th></tr></thead><tbody>${trips.map(g=>`<tr><td>${f(g.rep)}</td><td>${esc(g.name)}</td><td>${esc(g.phone)}</td><td>${esc(g.aPlace)}</td><td>${esc(vn(g.vehicle))}</td><td>${esc(g.hotel)}</td></tr>`).join("")}</tbody></table>`:""}).join("");
 pv(HDR("Hospitality Admin Report · "+list.length+" guests")+`<p class="ft">Generated ${esc(NOW())}</p><table class="wide"><thead><tr><th>Guest</th><th>Driver</th><th>Vehicle</th><th>Driver reports</th><th>Arrival</th><th>Hotel</th><th>Room / category</th><th>Stay</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="9">No guests yet.</td></tr>'}</tbody></table>${roster?`<h1 style="margin-top:18px;font-size:18px">Driver duty roster</h1>${roster}`:""}`,"landscape");
}
function drvPdf(id){
 const drivers=S.d.filter(d=>(!id||d.id===id)&&S.g.some(g=>g.driver===d.id));if(!drivers.length){alert("No trips are assigned to export.");return}
 const pages=drivers.map((d,i)=>{const trips=S.g.filter(g=>g.driver===d.id).sort((a,b)=>ms(a.rep)-ms(b.rep));const rows=trips.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.phone)}</td><td>${esc(g.pax||1)}</td><td>${esc([g.aMethod,g.aName,g.aNum].filter(Boolean).join(" "))}<br>${f(g.aAt)}</td><td>${esc(g.aPlace)}</td><td>${esc(g.hotel)}</td><td>${esc(vn(g.vehicle))}</td><td>${esc(g.notes)}</td></tr>`).join("");return `<div style="${i?'break-before:page;page-break-before:always':''}">${HDR("Driver Duty Sheet")}<div class="dv"><div style="font-size:22px;font-weight:800">${esc(d.name)}</div><div>Phone: ${esc(d.phone)}</div><p class="ft">Assigned trips: ${trips.length} · Generated ${esc(NOW())}</p></div><table><thead><tr><th>Guest</th><th>Phone</th><th>Pax</th><th>Arrival</th><th>Pickup point</th><th>Drop at hotel</th><th>Vehicle</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table><p class="ft">Please reach the pickup point at the reporting time and keep guest phone numbers handy.</p></div>`}).join("");
 pv(pages,"landscape");
}
function redPop(title,message){dlg.innerHTML=`<h2>⚠ ${esc(title)}</h2><p>${esc(message)}</p><button class="b" onclick="dlg.close()">OK</button>`;dlg.showModal()}
startAdminApp();
</script>
</body>
</html>
