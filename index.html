<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Hospitality Concierge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#292929;--mut:#6b6b6b;--gold:#C5A46D;--green:#243B32;--blush:#EAD5D0;--sage:#A8B5A0;--line:#e7e0d3;--bad:#a4442f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151c18;--card:#1f2a25;--ink:#f1ece2;--mut:#b4b0a6;--line:#33433b;--blush:#4a3a37;--bad:#e8907c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
header{background:var(--green);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:22px;color:#fff}header span{color:var(--gold);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;font:500 14px Inter;white-space:nowrap}
nav button.on{background:var(--green);color:#fff}
main{max-width:1150px;margin:0 auto;padding:18px 14px 60px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 6px #0000000d;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.stat b{display:block;font:700 28px 'Playfair Display',serif;color:var(--green)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stat b{color:var(--gold)}}
.stat small{color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
input,select,textarea,button.b{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.b{cursor:pointer;background:var(--green);color:#fff;border:0;font-weight:500}button.b.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.b.s{padding:5px 9px;font-size:13px}
button.b:active{transform:scale(.97)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{position:sticky;top:0;background:var(--card);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--blush);color:var(--ink);margin:1px}
.tag.ok{background:var(--sage);color:#17251d}.tag.warn{background:#f3d9a8;color:#4a3410}.tag.bad{background:var(--bad);color:#fff}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(560px,94vw);max-height:90vh;padding:20px}
dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.f .w{grid-column:1/-1}
@media(max-width:520px){.f{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.hh{background:#243B32;color:#F2C94C;font-weight:700;padding:8px 12px;border-radius:10px;border-bottom:3px solid #F2C94C}
.sc{cursor:pointer;text-align:left;font:inherit;color:inherit}
.pg .rsvp{border:2px solid #C5A46D;border-radius:10px;padding:10px 14px;margin-top:14px;background:#FAF7F2;color:#111;break-inside:avoid}
.pg a{color:#1a56a8;overflow-wrap:anywhere;word-break:break-all}
.empty{text-align:center;color:var(--mut);padding:30px}
h2{margin:6px 0 12px}h3{margin-bottom:8px}
.room{display:inline-block;font:700 20px 'Playfair Display',Georgia,serif;background:var(--blush);color:var(--ink);border:1px solid var(--gold);padding:2px 12px;border-radius:8px}
#pv{display:none}#pv.open{display:block;position:fixed;inset:0;background:#e9e6df;color:#111;overflow:auto;z-index:50;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#pv .tb{margin-bottom:12px;display:flex;gap:8px}
.pg{margin:0 auto;background:#fff;padding:10mm;box-shadow:0 2px 14px #0004;overflow:hidden}.pg.land{width:297mm}.pg.port{width:210mm}.pg h1{font-size:22px;color:#243B32;border-bottom:3px solid #C5A46D;padding-bottom:6px;margin:0 0 4px}.pg h2{font-size:16px;margin:12px 0 6px;color:#111}
.pg table{min-width:0;width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px}
.pg table.wide{min-width:1040px}
.pg th,.pg td{border:1px solid #cfc6b4;padding:5px 6px;overflow-wrap:break-word;word-break:normal;color:#111}
.pg th{position:static;background:#243B32;color:#fff;font-size:10px}
.pg tr{break-inside:avoid;page-break-inside:avoid}.pg thead{display:table-header-group}
.pg .pr th{width:32%;background:#EAD5D0;color:#111;font-size:13px;text-transform:none}.pg .pr td{font-size:15px}
.rm{font-weight:700;font-size:14px}
.pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hd{background:#243B32;color:#FAF7F2;text-align:center;padding:16px 10px 14px;border:2px solid #C5A46D;outline:1px solid #C5A46D;outline-offset:-7px;border-radius:6px;margin-bottom:14px}
.hd .orn{color:#C5A46D;letter-spacing:.5em;font-size:14px}.hd .nm{font:700 30px 'Playfair Display',Georgia,serif;color:#E7D3A6;margin:4px 0}.hd .sb{font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.dv{border:2px solid #C5A46D;background:#FFF8E8;border-radius:10px;padding:12px 16px;margin:10px 0}.dv h2{margin:0 0 6px;color:#243B32}.dv .big{display:inline-block;font:700 15px Inter,sans-serif;color:#243B32;background:#F2C94C;padding:2px 10px;border-radius:6px}.dv .ph{display:inline-block;font-size:14px;font-weight:700;margin:0 0 8px 8px;color:#111;border-bottom:2px solid #C5A46D}
.ms{border-left:4px solid #C5A46D;background:#FAF7F2;padding:10px 14px;margin-top:14px;font-style:italic;font-size:14px;color:#111}.pg .ft{color:#555;font-size:10px}
@media print{html,body{background:#fff}.pg{overflow:visible;width:auto!important;padding:0;box-shadow:none;zoom:1!important}.pg table.wide{min-width:0}body>*:not(#pv){display:none!important}#pv.open{position:static;overflow:visible;padding:0}#pv .tb{display:none}}
dialog{width:min(660px,94vw);overflow-x:hidden}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.15)}dialog[open]::backdrop{animation:fade .3s}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
.f label{min-width:0}.f input,.f select,.f textarea{width:100%;min-width:0}
.sec{border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px 14px 14px;margin:12px 0;background:color-mix(in srgb,var(--card) 94%,var(--gold));animation:up .5s both;animation-delay:calc(var(--i)*.09s)}
.sec:nth-of-type(2){border-left-color:var(--sage)}.sec:nth-of-type(3){border-left-color:#7aa6c9}.sec:nth-of-type(4){border-left-color:#F2C94C}
.sec h3{font-size:17px;margin:0 0 10px}
.stick{position:sticky;bottom:-20px;background:var(--card);padding:12px 0 4px;margin-top:10px}
button.b{transition:transform .15s,box-shadow .2s}button.b:hover{transform:translateY(-2px);box-shadow:0 5px 14px #0003}
nav button{transition:background .25s,transform .15s}nav button:hover{transform:translateY(-1px)}
tbody tr{animation:up .4s both}.grid>*{animation:up .5s both}.grid>:nth-child(2){animation-delay:.07s}.grid>:nth-child(3){animation-delay:.14s}.grid>:nth-child(4){animation-delay:.21s}.grid>:nth-child(5){animation-delay:.28s}
.row{animation:up .35s both}.room{animation:pop .45s both}
#ts{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#243B32;color:#F2C94C;padding:10px 20px;border-radius:999px;font-weight:600;z-index:99;box-shadow:0 6px 20px #0005;animation:toast 2s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
dialog.red{border:3px solid #c0392b;background:#fff0ee;color:#7a1f14;width:min(440px,92vw);animation:shake .45s}dialog.red h2{color:#c0392b;font-size:20px;margin-bottom:8px}dialog.red p{font-size:15px}dialog.red::backdrop{background:#7a1f1466}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.dh{font-size:17px;margin:14px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--gold)}.tm{display:inline-block;font-weight:600;background:var(--blush);color:var(--ink);padding:2px 12px;border-radius:999px;margin:8px 0 2px;font-size:13px}.gl{margin:2px 0 6px;padding-left:22px}.gl li{margin:4px 0}
.dn{font:800 19px Inter,sans-serif;color:var(--green)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .dn{color:var(--gold)}}
.pg .dname{font:800 24px Inter,sans-serif;color:#243B32}.pg .np{break-before:page;page-break-before:always}.pg h2.pdh{background:#243B32;color:#fff;padding:5px 10px;border-radius:6px;font-size:15px}.pg .tm2{font-weight:700;background:#F2C94C;color:#111;display:inline-block;padding:3px 12px;border-radius:999px;margin:10px 0 4px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style id="pg"></style></head><body>
<header><h1>Wedding Hospitality Concierge</h1><span>Guests · Hotels · Arrivals · Transport</span></header>
<nav id="nav"></nav><main id="m"></main><dialog id="dlg"></dialog><div id="pv"></div>
<script>
const H=["Welina Hotels Bhubaneswar","Marigold Hotels Bhubaneswar","Transitel Hotel Kolkata"];
const C={"Welina Hotels Bhubaneswar":"Bhubaneswar, Odisha","Marigold Hotels Bhubaneswar":"Bhubaneswar, Odisha","Transitel Hotel Kolkata":"Kolkata, West Bengal"};
const TABS=["Dashboard","Guests","Hotels","Arrivals","Transport","Data"];
let tab="Dashboard",q="",hf="",sf="",S;
const e=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D2=t=>{if(!t)return"";const m=String(t).match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/);return m?m[3]+"/"+m[2]+"/"+m[1]+(m[4]?" "+m[4]:""):t};
const D2I=s=>{if(!s)return"";const m=s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})\s+(\d{1,2}):(\d\d)$/);if(!m)return null;const z=n=>String(n).padStart(2,"0"),d=+m[1],mo=+m[2],y=+m[3],h=+m[4],mi=+m[5],t=new Date(y,mo-1,d);if(t.getMonth()!=mo-1||t.getDate()!=d||h>23||mi>59)return null;return y+"-"+z(mo)+"-"+z(d)+"T"+z(h)+":"+m[5]};
const NOW=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes())};
const f=t=>t?e(D2(t)):"—";
function load(){try{const r=JSON.parse(localStorage.getItem("wh1")||"null");if(r&&r.g)return r}catch(x){}return{g:[],d:[],v:[]}}
function save(){try{localStorage.setItem("wh1",JSON.stringify(S))}catch(x){}toast("Saved")}
function toast(m){document.querySelectorAll("#ts").forEach(x=>x.remove());const t=document.createElement("div");t.id="ts";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2000)}
S=load();
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const ms=t=>t?new Date(t).getTime():NaN;
const dn=id=>(S.d.find(x=>x.id==id)||{}).name||"";
const vn=id=>{const v=S.v.find(x=>x.id==id);return v?(v.model||v.type)+" — "+v.reg:""};
function nav(){document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';render()">${t}</button>`).join("")}
function render(){nav();const m=document.getElementById("m");m.innerHTML=V[tab]();m.style.animation="none";m.offsetHeight;m.style.animation=""}
function count(el){const n=+el.dataset.n;let i=0;const s=()=>{i++;el.textContent=Math.round(n*Math.min(1,i/18));if(i<18)requestAnimationFrame(s)};if(matchMedia("(prefers-reduced-motion:reduce)").matches)el.textContent=n;else s()}
function stat(l,n){return `<div class="card stat"><b data-n="${n}">0</b><small>${l}</small></div>`}
const missing=g=>g.aMethod&&(!g.aAt||!g.aPlace||(["Flight","Train"].includes(g.aMethod)&&!g.aNum));
const needsPick=g=>g.pickup!="No"&&g.aMethod&&(!g.driver||!g.vehicle);
const V={
Dashboard(){const g=S.g,t=today();
const st=[["Arriving today",g.filter(x=>(x.aAt||"").startsWith(t)).length],["Checking out today",g.filter(x=>(x.cout||"").startsWith(t)).length],["By flight",g.filter(x=>x.aMethod=="Flight").length],["By train",g.filter(x=>x.aMethod=="Train").length],["Pickups needing driver/vehicle",g.filter(needsPick).length],["Incomplete records",g.filter(x=>missing(x)||!x.hotel||!x.room).length]];
const up=g.filter(x=>x.aAt).sort((a,b)=>ms(a.aAt)-ms(b.aAt)).slice(0,8);
setTimeout(()=>document.querySelectorAll("[data-n]").forEach(count),0);
return `<div class="bar"><button class="b" onclick="gForm()">+ Add guest</button><button class="b g" onclick="tab='Transport';render()">Drivers &amp; vehicles</button></div>
<div class="grid">${[["Total guests","","#C5A46D"],["Expected","Expected","#F2C94C"],["Checked in","Checked in","#2e8b57"],["Checked out","Checked out","#c0392b"]].map(s=>`<button class="card stat sc" style="border-top:4px solid ${s[2]}" onclick="goSt('${s[1]}')"><b data-n="${s[1]?g.filter(x=>x.status==s[1]).length:g.length}">0</b><small>${s[0]}</small></button>`).join("")}</div>
<div class="grid">${st.map(s=>stat(s[0],s[1])).join("")}</div>
<h2>Guests per hotel</h2><div class="grid">${H.map(h=>`<div class="card"><b>${e(h)}</b><br><small>${g.filter(x=>x.hotel==h).length} guests</small></div>`).join("")}</div>
<h2>Upcoming arrivals</h2><div class="card">${up.length?up.map(x=>`<div class="row"><span><b>${e(x.name)}</b> · ${e(x.aMethod)} ${e(x.aName)} ${e(x.aNum)}</span><span>${f(x.aAt)}</span></div>`).join(""):'<div class="empty">No arrivals recorded yet. Add a guest with arrival details.</div>'}</div>`},
Guests(){const l=S.g.filter(x=>(!hf||x.hotel==hf)&&(!sf||x.status==sf)&&(!q||[x.name,x.phone,x.hotel,x.room,x.aNum].join(" ").toLowerCase().includes(q.toLowerCase())));
return `<div class="bar"><input id="qs" placeholder="Search name, phone, room, flight/train" value="${e(q)}" oninput="q=this.value;keep()"><select aria-label="Status filter" onchange="sf=this.value;render()"><option value="">All statuses</option>${["Expected","Checked in","Checked out","Cancelled"].map(s=>`<option ${s==sf?"selected":""}>${s}</option>`).join("")}</select><select onchange="hf=this.value;render()"><option value="">All hotels</option>${H.map(h=>`<option ${h==hf?"selected":""}>${e(h)}</option>`).join("")}</select><button class="b" onclick="gForm()">+ Add guest</button><button class="b g" onclick="adminPdf()">Export all (PDF)</button></div>
<div class="tw"><table><thead><tr><th>Guest</th><th>Hotel</th><th>Room</th><th>Stay</th><th>Status</th><th></th></tr></thead><tbody>${l.length?l.map(x=>`<tr><td><b>${e(x.name)}</b>${x.vip=="Yes"?' <span class="tag warn">VIP</span>':""}<br><small>${e(x.phone)} · ${e(x.pax||1)} pax</small></td><td>${e(x.hotel)||'<span class="tag bad">No hotel</span>'}</td><td><span class="room">${x.room?e(x.room):'<span class="tag warn">Room Not Assigned</span>'}</span><br><small>${e(x.cat)||"Category Not Set"}</small></td><td><small>In ${f(x.cin)}<br>Out ${f(x.cout)}</small></td><td>${stSel(x)}</td><td><button class="b s" onclick="gForm('${x.id}')">Edit details</button> <button class="b s" onclick="sheet('${x.id}')">Send / PDF</button><br><button class="b g s" onclick="del('${x.id}')">Delete</button></td></tr>`).join(""):'<tr><td colspan="6" class="empty">No guests yet. Use “Add guest” to start.</td></tr>'}</tbody></table></div>`},
Hotels(){return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">${H.map(h=>{const g=S.g.filter(x=>x.hotel==h);return `<div class="card"><h3>${e(h)}</h3><small>${C[h]}</small><p><b>${g.length}</b> guests</p><div class="bar"><span class="tag" style="background:#FFF2CC;color:#805B00">Expected ${g.filter(x=>x.status=="Expected").length}</span><span class="tag" style="background:#DDF3E4;color:#17663A">Checked in ${g.filter(x=>x.status=="Checked in").length}</span><span class="tag" style="background:#FCE3E3;color:#A12626">Checked out ${g.filter(x=>x.status=="Checked out").length}</span></div><small>${e(HA[h].a)} ${HA[h].ok?"":'<span class="tag warn">Address needs verification</span>'}</small><p><button class="b s" onclick="hf='${h}';sf='';tab='Guests';render()">Open guest list</button></p>${g.length?g.map(x=>`<div class="row"><b>${e(x.name)}</b>${x.room?`<span class="room">${e(x.room)}</span>`:'<span class="tag warn">Room Not Assigned</span>'}<small style="flex-basis:100%">${e(x.cat)||"Category Not Set"}</small>${stSel(x)}</div>`).join(""):'<div class="empty">No guests assigned.</div>'}</div>`}).join("")}</div>`},
Arrivals(){const l=S.g.filter(x=>x.aMethod).sort((a,b)=>ms(a.aAt)-ms(b.aAt));
return `<div class="bar"><small>Arrival time is when the flight/train lands. Driver reporting time is when the driver must be at the pickup point.</small></div><div class="tw"><table><thead><tr><th>Guest</th><th>Arrival</th><th>Reporting</th><th>Pickup</th><th>Flags</th></tr></thead><tbody>${l.length?l.map(x=>`<tr><td><b>${e(x.name)}</b><br><small>${e(x.pax||1)} pax → ${e(x.hotel)}</small></td><td>${f(x.aAt)}<br><small>${e(x.aMethod)} ${e(x.aName)} ${e(x.aNum)} · ${e(x.aPlace)}</small></td><td>${f(x.rep)}</td><td>${e(dn(x.driver))||"—"}<br><small>${e(vn(x.vehicle))}</small></td><td>${!x.driver?'<span class="tag bad">No driver</span>':""}${!x.vehicle?'<span class="tag bad">No vehicle</span>':""}${missing(x)?'<span class="tag warn">Missing info</span>':""}${x.driver&&x.vehicle?'<span class="tag ok">Assigned</span>':""}<br><button class="b g s" onclick="gForm('${x.id}')">Edit</button> <button class="b s" onclick="sheet('${x.id}')">Send / PDF</button></td></tr>`).join(""):'<tr><td colspan="5" class="empty">No arrivals yet.</td></tr>'}</tbody></table></div>`},

const fld=([k,l,t,o,w])=>`<label class="${w?"w":""}">${l}${t=="s"?`<select id="f_${k}">${o.map(x=>{const a=Array.isArray(x)?x:[x,x];return `<option value="${e(a[0])}" ${String(v[k]||"")==a[0]?"selected":""}>${e(a[1])}</option>`}).join("")}</select>`:t=="a"?`<textarea id="f_${k}" rows="2">${e(v[k])}</textarea>`:`<input id="f_${k}" type="${t}" value="${e(v[k])}" ${t=="datetime-local"?`oninput="document.getElementById('d_${k}').textContent=D2(this.value)"`:""}>${t=="datetime-local"?`<small id="d_${k}">${e(D2(v[k]))}</small>`:""}`}</label>`;
const h=fl.some(x=>x[0]=="hotel")?ST.map((s,i)=>{const m=fl.filter(x=>SM[x[0]]===i);return m.length?`<section class="sec" style="--i:${i}"><h3>${s[0]} ${s[1]}</h3><div class="f">${m.map(fld).join("")}</div></section>`:""}).join(""):`<div class="f">${fl.map(fld).join("")}</div>`;
d.innerHTML=`<h2>${e(title)}</h2>${h}<div class="bar stick"><button class="b" id="sv">Save</button><button class="b g" onclick="dlg.close()">Cancel</button></div>`;
d.showModal();document.getElementById("sv").onclick=()=>{const o={...v};fl.forEach(([k])=>o[k]=document.getElementById("f_"+k).value.trim());cb(o)}}
var curG;
ST.length=0;ST.push(["👤","Guest"],["✈️","Journey"],["🏨","Stay"],["🚗","Driver needs"],["📝","Notes"]);Object.keys(SM).forEach(k=>delete SM[k]);Object.assign(SM,{name:0,aMethod:1,aName:1,aNum:1,aPlace:1,aAt:1,hotel:2,cat:2,room:2,cin:2,cout:2,status:2,pickup:3,rep:3,driver:3,vehicle:3,phone:0,vip:0,pax:3,notes:4});
const AIR=["Bhubaneswar Airport","Kolkata Airport"],STN=["Bhubaneswar Station","Bhubaneswar Railway Station","Howrah Station","Sealdah Station","Kolkata (Chitpur) Station"];
function placeOpts(m,cur){const l=["Bhubaneswar Airport","Bhubaneswar Station","Kolkata Airport"];if(cur&&!l.includes(cur))l.push(cur);return[["","— select —"],...l.map(x=>[x,x])]}
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())}
dlg.addEventListener("change",ev=>{if(ev.target.id=="f_aMethod"){const c=document.getElementById("f_aPlace");if(c)c.innerHTML=placeOpts(ev.target.value,"").map(a=>`<option value="${e(a[0])}">${e(a[1])}</option>`).join("")}
if(ev.target.id=="f_aAt"&&ev.target.value){const t=new Date(ev.target.value).getTime();if(isNaN(t))return;[["cin",t+36e5],["rep",t-27e5]].forEach(([k,m])=>{const x=document.getElementById("f_"+k);if(!x)return;x.value=iso(new Date(m));const dl=document.getElementById("d_"+k);if(dl)dl.textContent=D2(x.value);x.dispatchEvent(new Event("change",{bubbles:true}))})}});
function roomClash(o,oth){if(!o.hotel||!o.room||["Checked out","Cancelled"].includes(o.status))return null;const r=o.room.trim().toLowerCase();return oth.find(x=>x.hotel==o.hotel&&(x.room||"").trim().toLowerCase()==r&&!["Checked out","Cancelled"].includes(x.status)&&(!(o.cin&&o.cout&&x.cin&&x.cout)||(ms(o.cin)<ms(x.cout)&&ms(x.cin)<ms(o.cout))))||null}
function drvClash(o,oth){if(!o.driver||!o.rep)return null;const pl=(o.aPlace||"").trim().toLowerCase();return oth.find(x=>x.driver==o.driver&&x.rep&&Math.abs(ms(x.rep)-ms(o.rep))<72e5&&!same(o,x))||null}
function same(o,x){const a=(o.aPlace||"").trim().toLowerCase();return !!a&&a==(x.aPlace||"").trim().toLowerCase()&&Math.abs(ms(o.rep)-ms(x.rep))<=18e5}
function PL(ex){return gv("aPlace")||(S.g.find(y=>y.id==ex)||{}).aPlace||""}
function drvMsg(dc,o){const a=(o.aPlace||"").trim().toLowerCase(),sp=a&&(dc.aPlace||"").trim().toLowerCase()==a;return "This driver already has a trip at <b>"+e(D2(dc.rep))+"</b> ("+e(dc.name)+", "+e(dc.aPlace||"pickup point not entered")+"). "+(sp?"The pickup place is the same but the time is different, so the driver is still busy.":"This time has already been allocated to the driver at a <b>different place</b>; a driver cannot be at two places in the same time frame.")+" The same driver can only share a pickup at the same place and the same time, up to the vehicle capacity. Please choose another driver or change the time or place."}
function capClash(o,oth){if(!o.driver||!o.vehicle||!o.rep)return null;const v=S.v.find(x=>x.id==o.vehicle);if(!v)return null;const m=oth.filter(x=>x.driver==o.driver&&x.rep&&same(o,x)),used=m.reduce((s,x)=>s+(+x.pax||1),0)+(+o.pax||1);return used>+v.cap?{used,cap:+v.cap,m,v}:null}
function capMsg(c){return "With this guest there would be <b>"+c.used+"</b> passengers on this shared trip, but <b>"+e((c.v.model||c.v.type)+" — "+c.v.reg)+"</b> holds only <b>"+c.cap+"</b>. Already on this trip: "+(c.m.map(x=>e(x.name)+" ("+(+x.pax||1)+")").join(", ")||"none")+". Please choose a bigger vehicle or another driver."}
dlg.addEventListener("change",ev=>{const i=ev.target.id;if(i=="f_aPlace"){const s=document.getElementById("f_driver");if(s){const c=s.value;s.innerHTML=drvOpts(gv("rep"),curG).map(a=>`<option value="${e(a[0])}">${e(a[1])}</option>`).join("");s.value=c}}
if(["f_driver","f_rep","f_aPlace","f_vehicle","f_pax"].includes(i)){const o={driver:gv("driver"),vehicle:gv("vehicle"),rep:gv("rep"),aPlace:gv("aPlace"),pax:gv("pax")},oth=S.g.filter(x=>x.id!=curG),cc=capClash(o,oth);if(cc&&!drvClash(o,oth))redPop("Vehicle capacity full",capMsg(cc))}});
function sched(t){const dt={};t.forEach(x=>{const d=x.rep?x.rep.slice(0,10):"",h=x.rep?x.rep.slice(11,16):"";(dt[d]=dt[d]||{});(dt[d][h]=dt[d][h]||[]).push(x)});
return Object.keys(dt).sort().map(d=>`<h3 class="dh">📅 ${d?e(D2(d)):"Date not set"}</h3>`+Object.keys(dt[d]).sort().map(h=>`<div class="tm">🕐 ${h?"Reports at "+e(h):"Time not set"}</div><ul class="gl">${dt[d][h].map(x=>`<li><b>${e(x.name)}</b> · ${e(x.pax||1)} pax · ${e(x.aPlace)||"place not set"}<br><small>${e(vn(x.vehicle))||"No vehicle"}</small></li>`).join("")}</ul>`).join("")).join("")}
function drvPdf(id){const ds=S.d.filter(d=>(!id||d.id==id)&&S.g.some(x=>x.driver==d.id));if(!ds.length){alert("No trips are assigned to export.");return}
const cg="<colgroup><col style='width:16%'><col style='width:11%'><col style='width:5%'><col style='width:20%'><col style='width:13%'><col style='width:14%'><col style='width:12%'><col style='width:9%'></colgroup>";
const pg=ds.map((d,i)=>{const t=S.g.filter(x=>x.driver==d.id),dt={};t.forEach(x=>{const k=x.rep?x.rep.slice(0,10):"",h=x.rep?x.rep.slice(11,16):"";(dt[k]=dt[k]||{});(dt[k][h]=dt[k][h]||[]).push(x)});
const vs=[...new Set(t.map(x=>vn(x.vehicle)).filter(Boolean))];
const body=Object.keys(dt).sort().map(k=>`<h2 class="pdh">📅 ${k?e(D2(k))+" · "+e(new Date(k+"T00:00").toLocaleDateString("en-IN",{weekday:"long"})):"Date not set"}</h2>`+Object.keys(dt[k]).sort().map(h=>{const g=dt[k][h],px=g.reduce((s,x)=>s+(+x.pax||1),0);return `<div class="tm2">🕐 ${h?"Driver reports at "+e(h):"Reporting time not set"} · ${g.length} guest${g.length>1?"s":""} · ${px} pax</div><table>${cg}<thead><tr><th>Guest</th><th>Phone</th><th>Pax</th><th>Arrival</th><th>Pickup point</th><th>Drop at hotel</th><th>Vehicle</th><th>Notes</th></tr></thead><tbody>${g.map(x=>`<tr><td><b>${e(x.name)}</b></td><td>${e(x.phone)}</td><td>${e(x.pax||1)}</td><td>${e([x.aMethod,x.aName,x.aNum].filter(Boolean).join(" "))}<br>${f(x.aAt)}</td><td>${e(x.aPlace)}</td><td>${e(x.hotel)}</td><td>${e(vn(x.vehicle))}</td><td>${e(x.notes)}</td></tr>`).join("")}</tbody></table>`}).join("")).join("");
return `<div class="${i?"np":""}">`+HDR("Driver Duty Sheet")+`<div class="dv"><div class="dname">${e(d.name)}</div><div class="ph" style="margin:4px 0 0">📞 ${e(d.phone)}</div><p class="ft" style="margin:6px 0 0">Vehicle: ${e(vs.join(", ")||"not assigned")} · ${t.length} guest${t.length>1?"s":""}</p></div>`+body+`<p class="ft">Please reach the pickup point at the reporting time and keep the guest phone numbers handy. Generated ${NOW()}</p></div>`}).join("");
pv(pg,"landscape")}
function redPop(t,m){document.querySelectorAll("#al").forEach(x=>x.remove());const a=document.createElement("dialog");a.id="al";a.className="red";a.setAttribute("role","alertdialog");a.innerHTML=`<h2>⚠ ${t}</h2><p>${m}</p><div class="bar"><button class="b" style="background:#c0392b" onclick="this.closest('dialog').close()">OK, I will change it</button></div>`;document.body.append(a);a.showModal()}
function gv(k){const x=document.getElementById("f_"+k);return x?x.value:""}
dlg.addEventListener("change",ev=>{const i=ev.target.id,oth=S.g.filter(x=>x.id!=curG);if(i=="f_room"||i=="f_hotel"||i=="f_cin"||i=="f_cout"){const o={hotel:gv("hotel"),room:gv("room").trim(),cin:gv("cin"),cout:gv("cout"),status:gv("status")},rc=roomClash(o,oth);if(rc)redPop("Room already allocated","Room <b>"+e(o.room)+"</b> of <b>"+e(o.hotel)+"</b> is already allocated to <b>"+e(rc.name)+"</b>. Please choose a different room number.")}if(i=="f_driver"||i=="f_rep"||i=="f_aPlace"){const o={driver:gv("driver"),rep:gv("rep"),aPlace:gv("aPlace")},dc=drvClash(o,oth);if(dc)redPop("Driver already allocated",drvMsg(dc,o))}});
function busy(did,rep,ex){if(!did||!rep)return null;return S.g.find(x=>x.id!=ex&&x.driver==did&&x.rep&&Math.abs(ms(x.rep)-ms(rep))<72e5&&!same({aPlace:PL(ex),rep},x))||null}
function drvOpts(rep,ex){return[["","— none —"],...S.d.map(d=>{const b=busy(d.id,rep,ex);return[d.id,d.name+(b?" — OCCUPIED (trip at "+D2(b.rep)+")":"")]})]}
function occTag(d){const n=Date.now(),z=k=>String(k).padStart(2,"0"),t=S.g.filter(x=>x.driver==d.id&&x.rep).sort((a,b)=>ms(a.rep)-ms(b.rep)),c=t.find(x=>n>=ms(x.rep)&&n<ms(x.rep)+72e5);if(c){const u=new Date(ms(c.rep)+72e5);return '<span class="tag bad">Occupied now until '+z(u.getHours())+':'+z(u.getMinutes())+'</span>'}const nx=t.find(x=>ms(x.rep)>n);return nx?'<span class="tag warn">Next trip '+D2(nx.rep)+'</span>':'<span class="tag ok">Free</span>'}
dlg.addEventListener("change",ev=>{if(ev.target.id=="f_rep"){const s=document.getElementById("f_driver");if(s){const c=s.value;s.innerHTML=drvOpts(ev.target.value,curG).map(a=>`<option value="${e(a[0])}">${e(a[1])}</option>`).join("");s.value=c}}});
